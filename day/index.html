<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjective of the Day</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfaf5;
    --fg: #1a1a1a;
    --accent: #d1495b;
    --muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #f2f0eb;
      --accent: #ff7a8a;
      --muted: #9a9a9a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  .card {
    max-width: 32rem;
  }
  .day {
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }
  .word {
    font-size: clamp(2.5rem, 10vw, 5rem);
    font-weight: 700;
    color: var(--accent);
    margin: 0;
    word-break: break-word;
  }
  .sub {
    margin-top: 1rem;
    font-size: 1rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="day" id="dayLabel"></p>
    <h1 class="word" id="wordLabel">loading…</h1>
    <p class="sub" id="subLabel">Choosing something delightful…</p>
  </div>

<script src="../daily-words.js"></script>
<script>
  const today = new Date();
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  document.getElementById("dayLabel").textContent =
    dayNames[today.getDay()] + " · " + today.toLocaleDateString();

  window.KRYSTAL_DAILY_WORDS.loadDailyWord(today).then(function (dailyWord) {
    document.getElementById("wordLabel").textContent =
      (dailyWord.word + " " + dailyWord.dayName).toUpperCase();
    document.getElementById("subLabel").textContent =
      "adjective — " + dailyWord.definition;
  });
</script>
</body>
</html>

/* ---------- curated word-of-the-day ---------- */
(function(){
  const today = new Date();
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  document.getElementById('dayLabel').textContent =
    dayNames[today.getDay()] + ' \u00b7 ' + today.toLocaleDateString();
  document.getElementById('subLabel').textContent = 'Gathering a good word\u2026';

  function showWord(dailyWord){
    const wordLabel = document.getElementById('wordLabel');
    wordLabel.textContent = (dailyWord.word + ' ' + dailyWord.dayName).toUpperCase();
    document.getElementById('subLabel').textContent =
      'adjective \u2014 ' + dailyWord.definition;

    // drop the phrase in from the top; once it lands, celebrate and let the
    // Mario-star flash spread to every bit of text on the page
    requestAnimationFrame(() => wordLabel.classList.add('landed'));
    wordLabel.addEventListener('transitionend', function onLand(e){
      if (e.propertyName !== 'transform') return;
      wordLabel.removeEventListener('transitionend', onLand);
      launchFirework(window.innerWidth*0.42);
      launchFirework(window.innerWidth*0.58);
      state = 'celebrate';
      actionTimer = 2.2;
      currentExpr = 'wave';
      exprFrame = 0; exprFrameTime = 0;
      bubble.textContent = '\ud83d\udc4b Welcome!';
      positionBubble();
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 2200);
      setTimeout(() => document.body.classList.add('starmode'), 250);
    });
  }

  window.KRYSTAL_DAILY_WORDS.loadDailyWord(today).then(showWord);
})();

/* ---------- sprites ---------- */
const WALK_SRC = 'sprites/sprites/walking/krystal-walk-processed.png';
const EXPR_DIR = 'sprites/sprites/expressions/krystal/';
const WALK_COLS = 4, WALK_ROWS = 4, WALK_ROW_RIGHT = 2, WALK_FOOT = 0.045;
const EXPR_COLS = 4, EXPR_FOOT = 0.078;
const CELEBRATE_POOL = ['cheer','laugh','wave','highfive'];
const ROUTINE_POOL   = ['think','point','nod','shrug','surprised'];
const SKY_EMOTE_POOL = ['wave','cheer','point','shrug','nod','look','surprised'];

function loadImg(src){ const im = new Image(); im.src = src; return im; }
const walkImg = loadImg(WALK_SRC);
const exprImgs = {};
[...new Set([...CELEBRATE_POOL, ...ROUTINE_POOL, ...SKY_EMOTE_POOL])].forEach(n => exprImgs[n] = loadImg(EXPR_DIR + n + '.png'));

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rand(a,b){ return a + Math.random()*(b-a); }

/* ---------- canvas setup (full viewport, fixed background) ---------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const bubble = document.getElementById('bubble');
const magicCloud = document.getElementById('magicCloud');
const clockChip = document.getElementById('clockChip');
const clockChipDot = clockChip.querySelector('.clock-dot');
const clockChipTime = document.getElementById('clockChipTime');
const debugClock = document.getElementById('debugClock');
let W = 0, H = 0, groundY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
  groundY = H*0.82;
  const resting = restingCloudPosition();
  if (!cloudRide.cloudX || cloudRide.phase === 'ground'){
    cloudRide.cloudX = resting.x;
    cloudRide.cloudY = resting.y;
    cloudRide.riderX = W*feetXFrac;
    cloudRide.riderFeetY = groundY+10;
  } else if (cloudRide.phase === 'up'){
    const perch = skyPerch();
    cloudRide.riderX = perch.x;
    cloudRide.riderFeetY = perch.feetY;
    cloudRide.cloudX = perch.x;
    cloudRide.cloudY = perch.feetY+20;
  }
  positionMagicCloud();
  positionBubble();
}
window.addEventListener('resize', resize);

/* ---------- state ---------- */
let scroll = 0;
const SPEED = 110;             // px/sec forward walk speed
const WALK_FPS = 8, EXPR_FPS = 6;
let walkFrame = 0, walkFrameTime = 0;
let exprFrame = 0, exprFrameTime = 0;
let state = 'walk';            // 'walk' | 'celebrate' | 'routine'
let currentExpr = null;
let actionTimer = 0;
let nextRoutineAt = performance.now() + rand(18000,32000);
let lastFunKey = null;
let celebratingKey = null;
let recelebrateAt = 0;

const feetXFrac = 0.24;

/* ---------- magic cloud elevator ---------- */
const cloudRide = {
  phase: 'ground', // ground | rising | up | lowering
  elapsed: 0,
  duration: 2.8,
  cloudX: 0,
  cloudY: 0,
  riderX: 0,
  riderFeetY: 0,
  startCloudX: 0,
  startCloudY: 0,
  startRiderX: 0,
  startRiderY: 0,
  skyEmoteElapsed: 0,
  skyEmote: 'wave',
};

function easeInOut(t){ return t < .5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function skyPerch(){
  return {
    x: Math.min(W-64, Math.max(64, W*.78)),
    feetY: Math.min(groundY-dispHeight()*.55, Math.max(250, H*.46)),
  };
}
function restingCloudPosition(){
  return { x: Math.min(W - 62, Math.max(W*.70, W*feetXFrac + 120)), y: Math.max(92, H*.24) };
}
function setCloudControls(){
  const isUp = cloudRide.phase === 'up';
  const moving = cloudRide.phase === 'rising' || cloudRide.phase === 'lowering';
  magicCloud.disabled = moving;
  magicCloud.classList.toggle('travelling', moving);
  magicCloud.dataset.hint = isUp ? 'back down' : 'take me up';
  magicCloud.title = isUp ? 'Click to carry Krystal back down' : 'Click to carry Krystal up';
  magicCloud.setAttribute('aria-label', isUp ? 'Cloud elevator: carry Krystal back down' : 'Cloud elevator: carry Krystal up');
}
function beginCloudRide(direction){
  if (cloudRide.phase === 'rising' || cloudRide.phase === 'lowering') return;
  cloudRide.phase = direction;
  cloudRide.elapsed = 0;
  cloudRide.startCloudX = cloudRide.cloudX;
  cloudRide.startCloudY = cloudRide.cloudY;
  cloudRide.startRiderX = cloudRide.riderX || W*feetXFrac;
  cloudRide.startRiderY = cloudRide.riderFeetY || groundY + 10;
  if (direction === 'rising') cloudRide.skyEmote = pick(SKY_EMOTE_POOL);
  bubble.classList.remove('show');
  setCloudControls();
}
magicCloud.addEventListener('click', e => {
  e.stopPropagation();
  beginCloudRide(cloudRide.phase === 'up' ? 'lowering' : 'rising');
});

function positionMagicCloud(){
  magicCloud.style.left = cloudRide.cloudX + 'px';
  magicCloud.style.top = cloudRide.cloudY + 'px';
}

function updateCloudRide(dt){
  const perch = skyPerch();
  const groundX = W*feetXFrac;
  const groundFeetY = groundY+10;

  if (cloudRide.phase === 'ground'){
    const resting = restingCloudPosition();
    cloudRide.cloudX = resting.x + Math.sin(cloudTime*.8)*7;
    cloudRide.cloudY = resting.y + Math.sin(cloudTime*1.35)*5;
    cloudRide.riderX = groundX;
    cloudRide.riderFeetY = groundFeetY;
  } else if (cloudRide.phase === 'up'){
    cloudRide.skyEmoteElapsed += dt;
    if (cloudRide.skyEmoteElapsed >= 2.8){
      const choices = SKY_EMOTE_POOL.filter(name => name !== cloudRide.skyEmote);
      cloudRide.skyEmote = pick(choices);
      cloudRide.skyEmoteElapsed = 0;
    }
    const floatY = Math.sin(cloudTime*1.4)*3;
    cloudRide.riderX = perch.x;
    cloudRide.riderFeetY = perch.feetY+floatY;
    cloudRide.cloudX = perch.x;
    cloudRide.cloudY = perch.feetY+20+floatY;
  } else {
    cloudRide.elapsed += dt;
    const raw = Math.min(1, cloudRide.elapsed/cloudRide.duration);

    if (cloudRide.phase === 'rising'){
      const pickupEnd = .30;
      if (raw < pickupEnd){
        const p = easeInOut(raw/pickupEnd);
        cloudRide.cloudX = cloudRide.startCloudX + (groundX-cloudRide.startCloudX)*p;
        cloudRide.cloudY = cloudRide.startCloudY + ((groundFeetY+20)-cloudRide.startCloudY)*p;
        cloudRide.riderX = groundX;
        cloudRide.riderFeetY = groundFeetY;
      } else {
        const p = easeInOut((raw-pickupEnd)/(1-pickupEnd));
        cloudRide.riderX = groundX + (perch.x-groundX)*p;
        cloudRide.riderFeetY = groundFeetY + (perch.feetY-groundFeetY)*p;
        cloudRide.cloudX = cloudRide.riderX;
        cloudRide.cloudY = cloudRide.riderFeetY+20;
      }
      if (raw >= 1){
        cloudRide.phase = 'up';
        cloudRide.skyEmoteElapsed = 0;
        cloudRide.skyEmote = pick(SKY_EMOTE_POOL);
        spawnSparkle(cloudRide.riderX, perch.feetY-18, '#fff7a8');
        showToast(cloudRide.riderX, perch.feetY-38, '☁️ Sky-high!');
        setCloudControls();
      }
    } else if (cloudRide.phase === 'lowering'){
      const dropEnd = .82;
      if (raw < dropEnd){
        const p = easeInOut(raw/dropEnd);
        cloudRide.riderX = cloudRide.startRiderX + (groundX-cloudRide.startRiderX)*p;
        cloudRide.riderFeetY = cloudRide.startRiderY + (groundFeetY-cloudRide.startRiderY)*p;
        cloudRide.cloudX = cloudRide.riderX;
        cloudRide.cloudY = cloudRide.riderFeetY+20;
      } else {
        const resting = restingCloudPosition();
        const p = easeInOut((raw-dropEnd)/(1-dropEnd));
        cloudRide.riderX = groundX;
        cloudRide.riderFeetY = groundFeetY;
        cloudRide.cloudX = groundX + (resting.x-groundX)*p;
        cloudRide.cloudY = (groundFeetY+20) + (resting.y-(groundFeetY+20))*p;
      }
      if (raw >= 1){
        cloudRide.phase = 'ground';
        spawnSparkle(groundX, groundFeetY-30, '#dff6ff');
        setCloudControls();
      }
    }
  }

  positionMagicCloud();
  positionBubble();
}

function dispHeight(){ return Math.max(100, Math.min(150, H*0.18)); }

function positionBubble(){
  const x = cloudRide.riderX || W*feetXFrac;
  const y = cloudRide.riderFeetY || groundY+10;
  bubble.style.left = x + 'px';
  bubble.style.top = (y - dispHeight() - 6) + 'px';
}

/* ---------- fun-time celebration ---------- */
function triggerCelebration(key, reason){
  celebratingKey = key;
  state = 'celebrate';
  actionTimer = 10;
  currentExpr = pick(CELEBRATE_POOL);
  exprFrame = 0; exprFrameTime = 0;
  bubble.textContent = `⏰ ${key} — ${reason}`;
  positionBubble();
  bubble.classList.add('show');
  launchFirework(W*feetXFrac + rand(-70,70));
  launchFirework(W*feetXFrac + rand(-150,150));
  startLeafDance();
}

function startRoutine(){
  if (state !== 'walk') return;
  state = 'routine';
  actionTimer = 2.6;
  currentExpr = pick(ROUTINE_POOL);
  exprFrame = 0; exprFrameTime = 0;
}

function currentFunKey(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  return `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function endAction(){
  if (state === 'celebrate' && celebratingKey && currentFunKey() === celebratingKey){
    // still the same fun minute — take a brief break, then celebrate again
    state = 'walk';
    bubble.classList.remove('show');
    recelebrateAt = performance.now() + 5000;
    return;
  }
  celebratingKey = null;
  state = 'walk';
  bubble.classList.remove('show');
  nextRoutineAt = performance.now() + rand(18000,32000);
}

function checkFunTime(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  const key = `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
  const reason = FUN_TIMES[key];
  clockChipTime.textContent = `${h12}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()>=12?'PM':'AM'}`;
  clockChipTime.dateTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  clockChip.classList.toggle('is-funtime', Boolean(reason));
  clockChipDot.textContent = reason ? '✦' : '';
  clockChip.setAttribute('aria-label', reason ? `Open FunTimes — ${key} is a FunTime` : 'Open FunTimes');
  debugClock.textContent = clockChipTime.textContent;
  if (key !== lastFunKey){
    lastFunKey = key;
    if (reason) triggerCelebration(key, reason);
  }
}

/* ---------- fireworks ---------- */
const fireworks = [];       // rockets rising toward their burst point
const fireworkSparks = [];  // exploded particles

function launchFirework(x, targetY){
  const ty = targetY != null ? Math.min(targetY, groundY * 0.78) : H * (0.15 + Math.random()*0.35);
  fireworks.push({
    x, y: H + 10, targetY: ty,
    speed: 320 + Math.random()*140,
    hue: Math.floor(Math.random()*360),
  });
}

function explodeFirework(fw){
  const count = 36 + Math.floor(Math.random()*24);
  for (let i=0; i<count; i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 60 + Math.random()*160;
    fireworkSparks.push({
      x: fw.x, y: fw.y,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: 0, maxLife: 0.8 + Math.random()*0.6,
      hue: ((fw.hue + rand(-20,20)) % 360 + 360) % 360,
    });
  }
}

function updateFireworks(dt){
  for (let i=fireworks.length-1; i>=0; i--){
    const fw = fireworks[i];
    fw.y -= fw.speed*dt;
    if (fw.y <= fw.targetY){ explodeFirework(fw); fireworks.splice(i,1); }
  }
  for (let i=fireworkSparks.length-1; i>=0; i--){
    const p = fireworkSparks[i];
    p.life += dt;
    if (p.life >= p.maxLife){ fireworkSparks.splice(i,1); continue; }
    p.vy += 130*dt;
    p.vx *= (1 - 1.6*dt);
    p.vy *= (1 - 0.4*dt);
    p.x += p.vx*dt;
    p.y += p.vy*dt;
  }
}

function drawFireworks(){
  for (const fw of fireworks){
    ctx.fillStyle = `hsl(${fw.hue},95%,68%)`;
    ctx.beginPath(); ctx.arc(fw.x, fw.y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = `hsla(${fw.hue},95%,68%,0.4)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(fw.x, fw.y); ctx.lineTo(fw.x, fw.y+14); ctx.stroke();
  }
  for (const p of fireworkSparks){
    const t = p.life / p.maxLife;
    const alpha = Math.max(0, 1-t);
    ctx.fillStyle = `hsla(${p.hue},95%,65%,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6*(1-t*0.6), 0, Math.PI*2); ctx.fill();
  }
}

/* clicks/touches: during a fun time they launch extra fireworks; otherwise
   they try to "spot" any ambient wildlife/scenery currently on screen */
function handlePointer(x, y){
  if (celebratingKey){ launchFirework(x, y); return; }
  handleSpotClick(x, y);
}
window.addEventListener('click', e => {
  if (e.target.closest('#clockChip')) return;
  handlePointer(e.clientX, e.clientY);
});
window.addEventListener('touchstart', e => {
  if (e.target.closest('#clockChip')) return;
  for (const t of e.touches) handlePointer(t.clientX, t.clientY);
}, {passive:true});

/* ---------- "spot it" click targets (rebuilt every frame in draw()) ---------- */
let clickTargets = [];
function registerClickTarget(x, y, r, onHit){
  clickTargets.push({ x, y, r, onHit });
}
function handleSpotClick(x, y){
  let best = null, bestDist = Infinity;
  for (const t of clickTargets){
    const d = Math.hypot(x - t.x, y - t.y);
    if (d <= t.r && d < bestDist){ best = t; bestDist = d; }
  }
  if (best) best.onHit();
}

/* ---------- sparkle + toast feedback for spotting wildlife ---------- */
const sparkles = [];
function spawnSparkle(x, y, color){
  const count = 10 + Math.floor(Math.random()*6);
  for (let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 30 + Math.random()*70;
    sparkles.push({
      x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: 0, maxLife: 0.5 + Math.random()*0.3, color,
    });
  }
}
function updateSparkles(dt){
  for (let i=sparkles.length-1;i>=0;i--){
    const s = sparkles[i];
    s.life += dt;
    if (s.life >= s.maxLife){ sparkles.splice(i,1); continue; }
    s.vy += 60*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
  }
}
function drawSparkles(){
  for (const s of sparkles){
    const t = s.life/s.maxLife, alpha = Math.max(0, 1-t);
    ctx.fillStyle = s.color; ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.4*(1-t*0.5), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const toasts = [];
function showToast(x, y, text){
  toasts.push({ x, y, text, life: 0, maxLife: 1.3 });
}
function updateToasts(dt){
  for (let i=toasts.length-1;i>=0;i--){
    const t = toasts[i];
    t.life += dt;
    if (t.life >= t.maxLife) toasts.splice(i,1);
  }
}
function drawToasts(){
  ctx.font = '600 13px sans-serif';
  ctx.textAlign = 'center';
  for (const t of toasts){
    const p = t.life/t.maxLife;
    const alpha = Math.max(0, 1 - p);
    const rise = p*22;
    ctx.fillStyle = `rgba(0,0,0,${(0.35*alpha).toFixed(2)})`;
    ctx.fillText(t.text, t.x+1, t.y-rise+1);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.fillText(t.text, t.x, t.y-rise);
  }
  ctx.textAlign = 'left';
}

/* ---------- distant bell tower (background scenery) ---------- */
const BELL_TOWER_PERIOD = 1500;
let bellSwing = 0, bellSwingVel = 0;
function ringBell(){
  bellSwingVel = 3.2;
}
function updateBellTower(dt){
  bellSwingVel -= bellSwing * 18 * dt;
  bellSwingVel *= (1 - 2.2*dt);
  bellSwing += bellSwingVel*dt;
}
function drawBellTower(){
  const factor = 0.20;
  const baseY = groundY + 24;
  const off = ((scroll*factor) % BELL_TOWER_PERIOD + BELL_TOWER_PERIOD) % BELL_TOWER_PERIOD;
  for (let rep = -off - BELL_TOWER_PERIOD; rep < W + BELL_TOWER_PERIOD; rep += BELL_TOWER_PERIOD){
    const tx = rep + BELL_TOWER_PERIOD*0.5;
    if (tx < -60 || tx > W+60) continue;
    const towerH = 110, towerW = 26;
    ctx.fillStyle = 'rgba(50,45,55,0.85)';
    ctx.fillRect(tx-towerW/2, baseY-towerH, towerW, towerH);
    ctx.beginPath();
    ctx.moveTo(tx-towerW/2-4, baseY-towerH);
    ctx.lineTo(tx, baseY-towerH-26);
    ctx.lineTo(tx+towerW/2+4, baseY-towerH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(20,18,24,0.9)';
    ctx.beginPath();
    ctx.arc(tx, baseY-towerH+18, 8, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(tx-8, baseY-towerH+18, 16, 14);
    ctx.save();
    ctx.translate(tx, baseY-towerH+20);
    ctx.rotate(bellSwing);
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(4, 9); ctx.lineTo(-4, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    registerClickTarget(tx, baseY-towerH+20, 30, () => {
      ringBell();
      spawnSparkle(tx, baseY-towerH+10, '#f4dfa0');
      showToast(tx, baseY-towerH-6, '🔔 Ding dong!');
    });
  }
}

/* ---------- sky (time-of-day gradient) ---------- */
function hexLerp(a,b,t){
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const SKY_KEYFRAMES = [
  [0,   '#0b1130','#1b2a52'],
  [5,   '#0b1130','#1b2a52'],
  [6.5, '#ff9a76','#ffd9a0'],
  [8,   '#6fb8ff','#cfeeff'],
  [16,  '#5aa8ff','#cfeeff'],
  [18.5,'#ff8a5c','#ffd39b'],
  [20,  '#241a4a','#5a3a6a'],
  [22,  '#0b1130','#1b2a52'],
  [24,  '#0b1130','#1b2a52'],
];
function skyColors(){
  const now = new Date();
  const t = now.getHours() + now.getMinutes()/60;
  for (let i=0;i<SKY_KEYFRAMES.length-1;i++){
    const [t0,top0,bot0] = SKY_KEYFRAMES[i];
    const [t1,top1,bot1] = SKY_KEYFRAMES[i+1];
    if (t>=t0 && t<=t1){
      const f = (t-t0)/(t1-t0);
      return { top: hexLerp(top0,top1,f), bottom: hexLerp(bot0,bot1,f), night: (t<6.5||t>18.5) };
    }
  }
  return { top: SKY_KEYFRAMES[0][1], bottom: SKY_KEYFRAMES[0][2], night: true };
}
const starDots = Array.from({length:60}, () => ({ x: Math.random(), y: Math.random()*0.7, r: rand(0.6,1.6), tw: rand(0,6.28) }));

function drawSky(sky){
  const g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,groundY);
  if (sky.night){
    ctx.fillStyle = '#fff';
    for (const s of starDots){
      const a = 0.4 + 0.6*Math.abs(Math.sin(s.tw + scroll*0.01));
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*groundY, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- parallax helpers ---------- */
function tiled(period, factor, drawFn){
  const off = ((scroll*factor) % period + period) % period;
  for (let x = -off - period; x < W + period; x += period) drawFn(x, period);
}

/* ---------- cloud system (independent of character scroll) ---------- */
let cloudTime = 0;
const CLOUD_WIND = 18;  // base px/sec drift

function seededRand(seed){
  let s = seed;
  return function(){ s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

const clouds = [];
function initClouds(){
  clouds.length = 0;
  const rng = seededRand(42);
  for (let i = 0; i < 14; i++){
    const layer = i < 5 ? 0 : (i < 10 ? 1 : 2); // 0=high/slow, 1=mid, 2=low/fast
    const baseSpeed = [0.4, 0.7, 1.0][layer];
    const baseY = [0.08, 0.18, 0.30][layer];
    const baseScale = [0.6, 0.85, 1.1][layer];
    const baseAlpha = [0.35, 0.55, 0.7][layer];
    const blobCount = 3 + Math.floor(rng() * 4);
    const blobs = [];
    for (let b = 0; b < blobCount; b++){
      blobs.push({
        ox: (rng() - 0.3) * 70 * baseScale,
        oy: (rng() - 0.5) * 18 * baseScale,
        rx: (14 + rng() * 28) * baseScale,
        ry: (8 + rng() * 12) * baseScale,
      });
    }
    clouds.push({
      x: rng() * 2400,
      y: baseY + (rng() - 0.5) * 0.06,
      speed: CLOUD_WIND * baseSpeed * (0.7 + rng() * 0.6),
      alpha: baseAlpha * (0.7 + rng() * 0.6),
      blobs: blobs,
      wrap: 2400,
    });
  }
}
initClouds();

function drawClouds(){
  for (const c of clouds){
    const screenY = c.y * groundY;
    const screenX = ((c.x - cloudTime * c.speed) % c.wrap + c.wrap) % c.wrap;
    // draw at screenX and screenX - wrap so clouds tile seamlessly
    for (let rep = screenX - c.wrap; rep < W + 120; rep += c.wrap){
      ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
      ctx.beginPath();
      for (const b of c.blobs){
        ctx.moveTo(rep + b.ox + b.rx, screenY + b.oy);
        ctx.ellipse(rep + b.ox, screenY + b.oy, b.rx, b.ry, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }
}

/* ---------- simple parallax hills ---------- */
function drawHills(){
  ctx.fillStyle = 'rgba(20,50,30,0.55)';
  tiled(340, 0.20, (x,p) => {
    ctx.beginPath();
    ctx.ellipse(x+p*0.5, groundY+24, p*0.62, 60, 0, Math.PI, 0);
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(30,70,40,0.6)';
  tiled(260, 0.35, (x,p) => {
    ctx.beginPath();
    ctx.ellipse(x+p*0.5, groundY+18, p*0.6, 46, 0, Math.PI, 0);
    ctx.fill();
  });
}

/* ---------- autumn trees + windblown leaves ---------- */
const AUTUMN_COLORS = ['#f6bd38','#ee8a2d','#d95d39','#b83b32','#d97b29','#f2a93b'];
const autumnLeaves = [];
const dancingLeaves = [];
const prefersLessMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let nextLeafAt = 0;

function drawAutumnTree(x, scale, canopyOffset){
  const baseY = groundY + 5;
  const trunkH = 105*scale;
  const trunkW = 15*scale;
  const topY = baseY-trunkH;

  ctx.fillStyle = 'rgba(32,25,20,.16)';
  ctx.beginPath();
  ctx.ellipse(x, baseY+3, 34*scale, 8*scale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#69432e';
  ctx.lineCap = 'round';
  ctx.lineWidth = 7*scale;
  ctx.beginPath();
  ctx.moveTo(x, baseY);
  ctx.lineTo(x+canopyOffset*.25, topY+25*scale);
  ctx.moveTo(x+canopyOffset*.12, topY+48*scale);
  ctx.lineTo(x-22*scale, topY+23*scale);
  ctx.moveTo(x+canopyOffset*.2, topY+39*scale);
  ctx.lineTo(x+25*scale, topY+13*scale);
  ctx.stroke();

  ctx.fillStyle = '#7c5034';
  ctx.beginPath();
  ctx.moveTo(x-trunkW/2, baseY);
  ctx.lineTo(x-trunkW*.32+canopyOffset*.22, topY+17*scale);
  ctx.lineTo(x+trunkW*.36+canopyOffset*.22, topY+17*scale);
  ctx.lineTo(x+trunkW/2, baseY);
  ctx.closePath();
  ctx.fill();

  const crownX = x+canopyOffset;
  const crownY = topY+5*scale;
  const blobs = [
    [-31,-3,31,25,0], [0,-20,34,28,1], [32,-3,30,24,2],
    [-17,20,34,25,3], [18,20,36,25,4], [2,3,39,31,5]
  ];
  for (const b of blobs){
    ctx.fillStyle = AUTUMN_COLORS[b[4]];
    ctx.beginPath();
    ctx.ellipse(crownX+b[0]*scale, crownY+b[1]*scale, b[2]*scale, b[3]*scale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // A few tiny canopy highlights keep the trees lively instead of blob-like.
  ctx.globalAlpha = .55;
  ctx.fillStyle = '#ffd66b';
  ctx.beginPath(); ctx.arc(crownX-22*scale,crownY-14*scale,7*scale,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(crownX+22*scale,crownY+9*scale,6*scale,0,7); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawAutumnTrees(){
  tiled(560, .52, (x) => {
    drawAutumnTree(x+92, .92, -5);
    drawAutumnTree(x+360, .68, 5);
  });
}

function spawnAutumnLeaf(){
  const fromSide = Math.random() < .28;
  autumnLeaves.push({
    x: fromSide ? -18 : rand(-20,W+20),
    y: fromSide ? rand(H*.12,groundY*.68) : rand(-40,H*.18),
    vx: rand(18,52),
    vy: rand(24,54),
    sway: rand(0,Math.PI*2),
    swaySpeed: rand(1.8,3.8),
    rotation: rand(0,Math.PI*2),
    spin: rand(-4.5,4.5),
    size: rand(5,9),
    color: pick(AUTUMN_COLORS),
    layer: Math.random() < .72 ? 'back' : 'front'
  });
}

function startLeafDance(){
  const count = prefersLessMotion ? 8 : 28;
  for (let i=0;i<count;i++){
    dancingLeaves.push({
      angle: (i/count)*Math.PI*2 + rand(-.12,.12),
      radius: rand(38,82),
      height: rand(-42,42),
      speed: rand(1.5,2.5) * (Math.random()<.5 ? -1 : 1),
      phase: rand(0,Math.PI*2),
      rotation: rand(0,Math.PI*2),
      spin: rand(-5,5),
      size: rand(6,10),
      color: pick(AUTUMN_COLORS),
      life: 0,
      maxLife: rand(7.5,10)
    });
  }
}

function updateAutumnLeaves(dt){
  const maxLeaves = prefersLessMotion ? 8 : Math.max(18, Math.min(42, Math.round(W/34)));
  const now = performance.now();
  if (autumnLeaves.length < maxLeaves && now >= nextLeafAt){
    spawnAutumnLeaf();
    nextLeafAt = now + (prefersLessMotion ? rand(900,1500) : rand(170,420));
  }

  const gust = 18 + Math.sin(cloudTime*.72)*16 + (celebratingKey ? 42 : 0);
  for (let i=autumnLeaves.length-1;i>=0;i--){
    const leaf = autumnLeaves[i];
    leaf.sway += leaf.swaySpeed*dt;
    leaf.rotation += leaf.spin*dt;
    leaf.x += (leaf.vx + gust + Math.sin(leaf.sway)*24)*dt;
    leaf.y += (leaf.vy + Math.cos(leaf.sway*.7)*10)*dt;
    if (leaf.y > H+24 || leaf.x > W+40) autumnLeaves.splice(i,1);
  }

  for (let i=dancingLeaves.length-1;i>=0;i--){
    const leaf = dancingLeaves[i];
    leaf.life += dt;
    leaf.angle += leaf.speed*dt;
    leaf.rotation += leaf.spin*dt;
    if (leaf.life >= leaf.maxLife) dancingLeaves.splice(i,1);
  }
}

function drawLeaf(x,y,size,rotation,color,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rotation);
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-size,0);
  ctx.quadraticCurveTo(-size*.2,-size*.78,size,0);
  ctx.quadraticCurveTo(-size*.2,size*.78,-size,0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(91,48,30,.45)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-size*.65,0); ctx.lineTo(size*.75,0); ctx.stroke();
  ctx.restore();
}

function drawAutumnLeaves(layer){
  for (const leaf of autumnLeaves){
    if (leaf.layer !== layer) continue;
    drawLeaf(leaf.x,leaf.y,leaf.size,leaf.rotation,leaf.color,layer==='front'?.9:.72);
  }
}

function drawDancingLeaves(front){
  const centerX = cloudRide.riderX || W*feetXFrac;
  const centerY = (cloudRide.riderFeetY || groundY+10) - dispHeight()*.52;
  for (const leaf of dancingLeaves){
    const isFront = Math.sin(leaf.angle) >= 0;
    if (isFront !== front) continue;
    const fadeIn = Math.min(1,leaf.life/.35);
    const fadeOut = Math.min(1,(leaf.maxLife-leaf.life)/1.2);
    const pulse = 1 + Math.sin(leaf.life*3+leaf.phase)*.14;
    const x = centerX + Math.cos(leaf.angle)*leaf.radius*pulse;
    const y = centerY + leaf.height + Math.sin(leaf.angle)*leaf.radius*.42;
    drawLeaf(x,y,leaf.size,leaf.rotation,leaf.color,Math.max(0,fadeIn*fadeOut));
  }
}

/* ---------- ground ---------- */
function drawGround(){
  // base grass
  ctx.fillStyle = '#2f6b3a';
  ctx.fillRect(0, groundY, W, H - groundY);

  // path/trail
  ctx.fillStyle = '#8a7650';
  ctx.fillRect(0, groundY + 4, W, 14);
  ctx.fillStyle = '#7d6a48';
  ctx.fillRect(0, groundY + 7, W, 8);

  // grass tufts
  ctx.fillStyle = '#3c8246';
  tiled(42, 1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, groundY + 20);
    ctx.lineTo(x + 11, groundY + 8);
    ctx.lineTo(x + 14, groundY + 20);
    ctx.fill();
  });

  // second grass layer
  ctx.fillStyle = '#327837';
  tiled(63, 1.1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 4, groundY + 22);
    ctx.lineTo(x + 7, groundY + 13);
    ctx.lineTo(x + 10, groundY + 22);
    ctx.fill();
  });

  // wildflowers
  tiled(97, 1, (x) => {
    ctx.fillStyle = '#f2c94c';
    ctx.beginPath(); ctx.arc(x + 30, groundY + 28, 2.4, 0, 7); ctx.fill();
  });
  tiled(131, 1, (x) => {
    ctx.fillStyle = '#e87fa0';
    ctx.beginPath(); ctx.arc(x + 50, groundY + 32, 2.0, 0, 7); ctx.fill();
  });
  tiled(173, 1, (x) => {
    ctx.fillStyle = '#a7d8f0';
    ctx.beginPath(); ctx.arc(x + 20, groundY + 26, 1.8, 0, 7); ctx.fill();
  });
}

/* ---------- foreground grass (closest layer, in front of character, bottom of view) ---------- */
function drawForegroundGrass(){
  const bottom = H;
  ctx.fillStyle = '#286e32';
  tiled(30, 1.3, (x) => {
    ctx.beginPath();
    ctx.moveTo(x, bottom);
    ctx.lineTo(x + 5, bottom - 45);
    ctx.lineTo(x + 10, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#1f5a28';
  tiled(44, 1.5, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, bottom);
    ctx.lineTo(x + 13, bottom - 55);
    ctx.lineTo(x + 18, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#37823c';
  tiled(52, 1.4, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 3, bottom);
    ctx.lineTo(x + 7, bottom - 35);
    ctx.lineTo(x + 11, bottom);
    ctx.fill();
  });
}

/* ---------- Krystal ---------- */
function drawMagicCloud(){
  const interactive = magicCloud.matches(':hover') || magicCloud.matches(':focus-visible');
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${interactive ? 70 : 64}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  ctx.shadowColor = cloudRide.phase === 'rising' || cloudRide.phase === 'lowering'
    ? 'rgba(255,247,168,.9)'
    : 'rgba(72,142,205,.45)';
  ctx.shadowBlur = interactive ? 18 : 10;
  ctx.fillText('☁️', cloudRide.cloudX, cloudRide.cloudY);
  ctx.restore();
}

function drawKrystal(){
  const feetX = cloudRide.riderX || W*feetXFrac;
  const feetY = cloudRide.riderFeetY || groundY+10;
  const dispH = dispHeight();
  const isSkyHigh = cloudRide.phase === 'up';
  const bob = state==='walk' ? Math.abs(Math.sin(scroll*0.045))*3 : 0;

  if (isSkyHigh){
    const img = exprImgs[cloudRide.skyEmote];
    if (img && img.complete && img.naturalWidth){
      const fw = img.naturalWidth/EXPR_COLS, fh = img.naturalHeight;
      const dispW = dispH*(fw/fh);
      const foot = EXPR_FOOT*dispH;
      const skyFrame = Math.floor(cloudRide.skyEmoteElapsed*EXPR_FPS)%EXPR_COLS;
      ctx.drawImage(img, skyFrame*fw, 0, fw, fh,
                    feetX-dispW/2, feetY-dispH+foot, dispW, dispH);
    }
  } else if (state === 'walk'){
    if (walkImg.complete && walkImg.naturalWidth){
      const fw = walkImg.naturalWidth/WALK_COLS, fh = walkImg.naturalHeight/WALK_ROWS;
      const dispW = dispH*(fw/fh);
      const foot = WALK_FOOT*dispH;
      ctx.drawImage(walkImg, walkFrame*fw, WALK_ROW_RIGHT*fh, fw, fh,
                    feetX-dispW/2, feetY-dispH+foot-bob, dispW, dispH);
    }
  } else {
    const img = exprImgs[currentExpr];
    if (img && img.complete && img.naturalWidth){
      const fw = img.naturalWidth/EXPR_COLS, fh = img.naturalHeight;
      const dispW = dispH*(fw/fh);
      const foot = EXPR_FOOT*dispH;
      ctx.drawImage(img, exprFrame*fw, 0, fw, fh,
                    feetX-dispW/2, feetY-dispH+foot, dispW, dispH);
    }
  }
  if (cloudRide.phase === 'ground'){
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(feetX, feetY+3, 22, 6, 0, 0, 7); ctx.fill();
  }
}

/* ---------- loop ---------- */
function update(dt, isNight){
  // clouds drift independent of the character
  cloudTime += dt;
  updateCloudRide(dt);
  updateFireworks(dt);
  updateSparkles(dt);
  updateToasts(dt);
  updateBellTower(dt);
  updateBirds(dt, isNight);
  updateButterflies(dt, isNight);
  updateFireflies(dt, isNight);
  updateShootingStars(dt, isNight);
  updateAutumnLeaves(dt);

  // Krystal always moves forward
  scroll += SPEED*dt;
  walkFrameTime += dt;
  if (walkFrameTime >= 1/WALK_FPS){ walkFrameTime -= 1/WALK_FPS; walkFrame = (walkFrame+1)%WALK_COLS; }

  if (state === 'walk'){
    if (celebratingKey && performance.now() >= recelebrateAt){
      if (currentFunKey() === celebratingKey) triggerCelebration(celebratingKey, FUN_TIMES[celebratingKey]);
      else celebratingKey = null;
    } else if (!celebratingKey && performance.now() >= nextRoutineAt){
      startRoutine();
    }
  } else {
    exprFrameTime += dt;
    if (exprFrameTime >= 1/EXPR_FPS){ exprFrameTime -= 1/EXPR_FPS; exprFrame = (exprFrame+1)%EXPR_COLS; }
    actionTimer -= dt;
    if (actionTimer <= 0) endAction();
  }
}

function draw(sky){
  clickTargets = [];
  drawSky(sky);
  drawShootingStars();
  drawClouds();
  drawBirds();
  drawHills();
  drawBellTower();
  drawAutumnTrees();
  drawAutumnLeaves('back');
  drawGround();
  drawFireflies();
  drawMagicCloud();
  drawDancingLeaves(false);
  drawKrystal();
  drawDancingLeaves(true);
  drawButterflies();
  drawForegroundGrass();
  drawAutumnLeaves('front');
  drawFireworks();
  drawSparkles();
  drawToasts();
}

let last = performance.now();
let funTimeAccum = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  funTimeAccum += dt;
  if (funTimeAccum >= 1){ funTimeAccum = 0; checkFunTime(); }
  const sky = skyColors();
  update(dt, sky.night);
  draw(sky);
  requestAnimationFrame(loop);
}

resize();
checkFunTime();
requestAnimationFrame(loop);

/* ---------- debug (add ?debug to the URL) ---------- */
if (new URLSearchParams(location.search).has('debug')){
  const panel = document.getElementById('debugPanel');
  panel.classList.remove('hide');
  document.getElementById('debugGo').addEventListener('click', () => {
    const key = document.getElementById('debugKey').value.trim();
    if (key) triggerCelebration(key, FUN_TIMES[key] || 'Custom fun time!');
  });
  document.getElementById('debugRoutine').addEventListener('click', startRoutine);
}

</script>

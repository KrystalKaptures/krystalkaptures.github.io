/* ---------- adjective-of-the-day ---------- */
(function(){
  const ADJECTIVE_LIST_URL =
    "https://raw.githubusercontent.com/taikuukaits/SimpleWordlists/master/Wordlist-Adjectives-All.txt";

  const FALLBACK_ADJECTIVES_BY_DAY = {
    0: ["sunny","super","superb","superior","supple","supportive","surly","surprising","suspicious","sultry","sumptuous","sunlit","suave","silly","simple","sincere","skillful","sleek","sleepy","slender","slick","slippery","slow","sly","small","smart","smoky","smooth","snappy","snazzy","sneaky","snug","sociable","soft","solemn","solid","soothing","sophisticated","sorrowful","soulful","sparkling","special","spectacular","speedy","spicy","spirited","splendid","spontaneous","spotless","spry","spunky","stable","starry","steady","stern","sticky","stormy","strange","striking","strong","stubborn","stunning","sturdy","stylish","subtle","successful","sudden","sullen"],

    2: ["tall","tame","tangy","tart","tasty","tattered","tedious","teeming","tender","tense","terrific","testy","tidy","tight","timeless","timid","tingly","tiny","tired","torn","tough","towering","tragic","tranquil","transparent","treacherous","tremendous","tricky","trim","triumphant","trivial","tropical","troubled","trusty","turbulent","twinkling","twisted","typical","talkative","tactful","talented"],
    3: ["warm","wacky","wandering","wary","wasteful","watchful","watery","wavy","wealthy","weary","weak","wee","weedy","weepy","weighty","weird","welcoming","wet","whimsical","whiny","wholesome","wicked","wide","wild","willing","wily","windy","wintry","wiry","wise","wishful","wistful","witty","wobbly","wondrous","wooden","woolly","worldly","worn","worried","worthy","wrinkled","wry"],
    4: ["thankful","thoughtful","thorough","thrilling","thriving","thunderous","thin","thick","thirsty","thorny","threadbare","threatening","thrifty","throbbing","thoughtless","thundering","theatrical","therapeutic","thick-skinned","thin-skinned","thrilled","throaty","thumping","thunderstruck"],
    5: ["fresh","friendly","frantic","frigid","frisky","frugal","fruity","frosty","frail","free","frenzied","freckled","frequent","frightened","frothy","frumpy","fragrant","fragile","frank","fabulous","faithful","fanciful","fancy","fantastic","fast","fat","faded","faint","fair","familiar","famous","feisty","feeble","ferocious","fervent","festive","fickle","fierce","fiery","filthy","fine","firm","fit","flaky","flamboyant","flashy","flat","flawless","fleeting","flimsy","flirty","floral","fluffy","fluid","foamy","foggy","fond","foolish","forgetful","forgiving","formal","fortunate"],
    6: ["sad","safe","salty","sandy","sappy","sarcastic","sassy","satisfied","savage","savory","saintly","sacred","sanguine","saucy","saggy","sallow","salient","scarce","scared","scary","scattered","scenic","scholarly","scrawny","scruffy","secretive","secure","sedate","selfish","sensible","sensitive","serene","serious","severe","shabby","shady","shaggy","shaky","shallow","shameless","sharp","sheepish","shiny","shivering","shocking","short","shrewd","shy","silent"]
  };

  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dayPrefixes = ["s","m","t","w","th","f","s"];
  const today = new Date();
  const dayIndex = today.getDay();

  document.getElementById('dayLabel').textContent = dayNames[dayIndex] + ' \u00b7 ' + today.toLocaleDateString();

  function matchesDay(word, dIndex){
    const w = word.toLowerCase();
    const prefix = dayPrefixes[dIndex];
    if (dIndex === 2) return w.startsWith('t') && !w.startsWith('th');
    return w.startsWith(prefix);
  }

  function fetchDefinition(word){
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
      .then(res => { if (!res.ok) throw new Error('No definition found'); return res.json(); })
      .then(data => {
        const meanings = data[0] && data[0].meanings;
        if (!meanings) throw new Error('No meanings in response');
        const adjMeaning = meanings.find(m => m.partOfSpeech === 'adjective') || meanings[0];
        const def = adjMeaning && adjMeaning.definitions && adjMeaning.definitions[0] && adjMeaning.definitions[0].definition;
        if (!def) throw new Error('No definition in response');
        const pos = adjMeaning.partOfSpeech ? adjMeaning.partOfSpeech + ' \u2014 ' : '';
        document.getElementById('subLabel').textContent = pos + def;
      })
      .catch(() => {
        document.getElementById('subLabel').textContent = '';
      });
  }

  function showWord(words){
    const idx = Math.floor(Math.random()*words.length);
    const word = words[idx];
    const wordLabel = document.getElementById('wordLabel');
    wordLabel.textContent = (word + ' ' + dayNames[dayIndex]).toUpperCase();
    document.getElementById('dayLabel').textContent += ' \u00b7 word: ' + (idx+1) + ' / ' + words.length;
    document.getElementById('subLabel').textContent = 'Looking up definition\u2026';
    fetchDefinition(word);

    // drop the phrase in from the top; once it lands, celebrate and let the
    // Mario-star flash spread to every bit of text on the page
    requestAnimationFrame(() => wordLabel.classList.add('landed'));
    wordLabel.addEventListener('transitionend', function onLand(e){
      if (e.propertyName !== 'transform') return;
      wordLabel.removeEventListener('transitionend', onLand);
      launchFirework(window.innerWidth*0.42);
      launchFirework(window.innerWidth*0.58);
      state = 'celebrate';
      actionTimer = 2.2;
      currentExpr = 'wave';
      exprFrame = 0; exprFrameTime = 0;
      bubble.textContent = '\ud83d\udc4b Welcome!';
      positionBubble();
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 2200);
      setTimeout(() => document.body.classList.add('starmode'), 250);
    });
  }

  fetch(ADJECTIVE_LIST_URL)
    .then(res => { if (!res.ok) throw new Error('Bad response: ' + res.status); return res.text(); })
    .then(text => {
      const allWords = text.split('\n').map(w => w.trim())
        .filter(w => w.length > 0 && /^[a-z][a-z-]*$/.test(w));
      const matched = allWords.filter(w => matchesDay(w, dayIndex));
      if (matched.length === 0) throw new Error('No matches in fetched list');
      showWord(matched);
    })
    .catch(err => {
      console.warn('Falling back to built-in word list:', err);
      showWord(FALLBACK_ADJECTIVES_BY_DAY[dayIndex]);
    });
})();

/* ---------- sprites ---------- */
const WALK_SRC = 'sprites/sprites/walking/krystal-walk-processed.png';
const EXPR_DIR = 'sprites/sprites/expressions/krystal/';

const CELEBRATE_POOL = ['cheer','laugh','wave','highfive'];
const ROUTINE_POOL   = ['think','point','nod','shrug','surprised'];

const walkImg = loadImg(WALK_SRC);
const exprImgs = {};
[...new Set([...CELEBRATE_POOL, ...ROUTINE_POOL])].forEach(n => exprImgs[n] = loadImg(EXPR_DIR + n + '.png'));

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rand(a,b){ return a + Math.random()*(b-a); }

/* ---------- canvas setup (full viewport, fixed background) ---------- */
const cv = document.getElementById('cv');

function resize(){

  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);

  ctx.imageSmoothingEnabled = false;

/* ---------- state ---------- */

const SPEED = 110;             // px/sec forward walk speed

let exprFrame = 0, exprFrameTime = 0;

/* ---------- fun-time celebration ---------- */
function triggerCelebration(key, reason){
  celebratingKey = key;
  state = 'celebrate';
  actionTimer = 10;
  currentExpr = pick(CELEBRATE_POOL);
  exprFrame = 0; exprFrameTime = 0;
  bubble.textContent = `⏰ ${key} — ${reason}`;
  positionBubble();
  bubble.classList.add('show');
  launchFirework(W*feetXFrac + rand(-70,70));
  launchFirework(W*feetXFrac + rand(-150,150));
}

function startRoutine(){
  if (state !== 'walk') return;
  state = 'routine';
  actionTimer = 2.6;
  currentExpr = pick(ROUTINE_POOL);
  exprFrame = 0; exprFrameTime = 0;
}

function currentFunKey(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  return `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function endAction(){
  if (state === 'celebrate' && celebratingKey && currentFunKey() === celebratingKey){
    // still the same fun minute — take a brief break, then celebrate again
    state = 'walk';
    bubble.classList.remove('show');
    recelebrateAt = performance.now() + 5000;
    return;
  }
  celebratingKey = null;
  state = 'walk';
  bubble.classList.remove('show');
  nextRoutineAt = performance.now() + rand(18000,32000);
}

function checkFunTime(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  const key = `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
  clockChip.textContent = `${h12}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()>=12?'PM':'AM'}`;
  debugClock.textContent = clockChip.textContent;
  if (key !== lastFunKey){
    lastFunKey = key;
    const reason = FUN_TIMES[key];
    if (reason) triggerCelebration(key, reason);
  }
}

/* ---------- fireworks ---------- */
const fireworks = [];       // rockets rising toward their burst point
const fireworkSparks = [];  // exploded particles

function launchFirework(x, targetY){
  const ty = targetY != null ? Math.min(targetY, groundY * 0.78) : H * (0.15 + Math.random()*0.35);
  fireworks.push({
    x, y: H + 10, targetY: ty,
    speed: 320 + Math.random()*140,
    hue: Math.floor(Math.random()*360),
  });
}

function explodeFirework(fw){
  const count = 36 + Math.floor(Math.random()*24);
  for (let i=0; i<count; i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 60 + Math.random()*160;
    fireworkSparks.push({
      x: fw.x, y: fw.y,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: 0, maxLife: 0.8 + Math.random()*0.6,
      hue: ((fw.hue + rand(-20,20)) % 360 + 360) % 360,
    });
  }
}

function updateFireworks(dt){
  for (let i=fireworks.length-1; i>=0; i--){
    const fw = fireworks[i];
    fw.y -= fw.speed*dt;
    if (fw.y <= fw.targetY){ explodeFirework(fw); fireworks.splice(i,1); }
  }
  for (let i=fireworkSparks.length-1; i>=0; i--){
    const p = fireworkSparks[i];
    p.life += dt;
    if (p.life >= p.maxLife){ fireworkSparks.splice(i,1); continue; }
    p.vy += 130*dt;
    p.vx *= (1 - 1.6*dt);
    p.vy *= (1 - 0.4*dt);
    p.x += p.vx*dt;
    p.y += p.vy*dt;
  }
}

function drawFireworks(){
  for (const fw of fireworks){
    ctx.fillStyle = `hsl(${fw.hue},95%,68%)`;
    ctx.beginPath(); ctx.arc(fw.x, fw.y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = `hsla(${fw.hue},95%,68%,0.4)`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(fw.x, fw.y); ctx.lineTo(fw.x, fw.y+14); ctx.stroke();
  }
  for (const p of fireworkSparks){
    const t = p.life / p.maxLife;
    const alpha = Math.max(0, 1-t);
    ctx.fillStyle = `hsla(${p.hue},95%,65%,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6*(1-t*0.6), 0, Math.PI*2); ctx.fill();
  }
}

/* clicks/touches: during a fun time they launch extra fireworks; otherwise
   they try to "spot" any ambient wildlife/scenery currently on screen */
function handlePointer(x, y){
  if (celebratingKey){ launchFirework(x, y); return; }
  handleSpotClick(x, y);
}
window.addEventListener('click', e => handlePointer(e.clientX, e.clientY));
window.addEventListener('touchstart', e => {
  for (const t of e.touches) handlePointer(t.clientX, t.clientY);
}, {passive:true});

/* ---------- "spot it" click targets (rebuilt every frame in draw()) ---------- */
let clickTargets = [];
function registerClickTarget(x, y, r, onHit){
  clickTargets.push({ x, y, r, onHit });
}
function handleSpotClick(x, y){
  let best = null, bestDist = Infinity;
  for (const t of clickTargets){
    const d = Math.hypot(x - t.x, y - t.y);
    if (d <= t.r && d < bestDist){ best = t; bestDist = d; }
  }
  if (best) best.onHit();
}

/* ---------- sparkle + toast feedback for spotting wildlife ---------- */
const sparkles = [];
function spawnSparkle(x, y, color){
  const count = 10 + Math.floor(Math.random()*6);
  for (let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 30 + Math.random()*70;
    sparkles.push({
      x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: 0, maxLife: 0.5 + Math.random()*0.3, color,
    });
  }
}
function updateSparkles(dt){
  for (let i=sparkles.length-1;i>=0;i--){
    const s = sparkles[i];
    s.life += dt;
    if (s.life >= s.maxLife){ sparkles.splice(i,1); continue; }
    s.vy += 60*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
  }
}
function drawSparkles(){
  for (const s of sparkles){
    const t = s.life/s.maxLife, alpha = Math.max(0, 1-t);
    ctx.fillStyle = s.color; ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(s.x, s.y, 2.4*(1-t*0.5), 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const toasts = [];
function showToast(x, y, text){
  toasts.push({ x, y, text, life: 0, maxLife: 1.3 });
}
function updateToasts(dt){
  for (let i=toasts.length-1;i>=0;i--){
    const t = toasts[i];
    t.life += dt;
    if (t.life >= t.maxLife) toasts.splice(i,1);
  }
}
function drawToasts(){
  ctx.font = '600 13px sans-serif';
  ctx.textAlign = 'center';
  for (const t of toasts){
    const p = t.life/t.maxLife;
    const alpha = Math.max(0, 1 - p);
    const rise = p*22;
    ctx.fillStyle = `rgba(0,0,0,${(0.35*alpha).toFixed(2)})`;
    ctx.fillText(t.text, t.x+1, t.y-rise+1);
    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.fillText(t.text, t.x, t.y-rise);
  }
  ctx.textAlign = 'left';
}

/* ---------- birds (daytime flybys) ---------- */
const birds = [];
let nextBirdAt = performance.now() + rand(6000,12000);
function spawnBird(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  birds.push({
    x: dir > 0 ? -40 : W + 40,
    y: rand(H*0.08, H*0.28),
    vx: dir * rand(45,85),
    phase: Math.random()*10,
    size: rand(8,13),
  });
}
function updateBirds(dt, isNight){
  if (!isNight && !celebratingKey && birds.length < 2 && performance.now() >= nextBirdAt){
    spawnBird();
    nextBirdAt = performance.now() + rand(10000,22000);
  }
  for (let i=birds.length-1;i>=0;i--){
    const b = birds[i];
    b.phase += dt*9;
    b.x += b.vx*dt;
    b.y += Math.sin(b.phase*0.4)*10*dt;
    if (b.x < -60 || b.x > W+60) birds.splice(i,1);
  }
}
function drawBirds(){
  ctx.strokeStyle = 'rgba(40,40,55,0.85)';
  ctx.lineWidth = 1.6;
  for (const b of birds){
    const flap = Math.sin(b.phase) * b.size * 0.55;
    ctx.beginPath();
    ctx.moveTo(b.x - b.size, b.y - flap);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(b.x + b.size, b.y - flap);
    ctx.stroke();
    registerClickTarget(b.x, b.y, b.size*2.2, () => {
      const idx = birds.indexOf(b);
      if (idx >= 0) birds.splice(idx, 1);
      spawnSparkle(b.x, b.y, '#fff2c0');
      showToast(b.x, b.y - 14, '🐦 Spotted a bird!');
    });
  }
}

/* ---------- butterflies (daytime, near the flowers) ---------- */
const butterflies = [];
let nextButterflyAt = performance.now() + rand(5000,11000);
function spawnButterfly(){
  butterflies.push({
    x: rand(0, W),
    baseY: groundY - rand(20, 90),
    phase: Math.random()*10,
    speed: rand(0.6,1.3),
    size: rand(5,8),
    hue: pick([330, 45, 200, 20]),
  });
}
function updateButterflies(dt, isNight){
  if (!isNight && !celebratingKey && butterflies.length < 3 && performance.now() >= nextButterflyAt){
    spawnButterfly();
    nextButterflyAt = performance.now() + rand(8000,18000);
  }
  for (let i=butterflies.length-1;i>=0;i--){
    const b = butterflies[i];
    b.phase += dt*6*b.speed;
    b.x += 12*dt*b.speed;
    if (b.x > W+40) butterflies.splice(i,1);
  }
}
function drawButterflies(){
  for (const b of butterflies){
    const y = b.baseY + Math.sin(b.phase*1.3)*10;
    const wing = Math.abs(Math.sin(b.phase))*b.size + b.size*0.4;
    ctx.fillStyle = `hsl(${b.hue},70%,65%)`;
    ctx.beginPath();
    ctx.ellipse(b.x - wing*0.5, y, wing*0.6, b.size*0.5, 0.4, 0, Math.PI*2);
    ctx.ellipse(b.x + wing*0.5, y, wing*0.6, b.size*0.5, -0.4, 0, Math.PI*2);
    ctx.fill();
    registerClickTarget(b.x, y, b.size*3, () => {
      const idx = butterflies.indexOf(b);
      if (idx >= 0) butterflies.splice(idx, 1);
      spawnSparkle(b.x, y, '#ffd6ec');
      showToast(b.x, y - 14, '🦋 Found a butterfly!');
    });
  }
}

/* ---------- fireflies (nighttime, near the grass) ---------- */
const fireflies = [];
let nextFireflyAt = performance.now() + rand(3000,7000);
function spawnFirefly(){
  fireflies.push({
    x: rand(0, W), y: rand(groundY-70, groundY-10),
    vx: rand(-8,8), vy: rand(-6,6),
    phase: Math.random()*10, life: 0, maxLife: rand(6,12),
  });
}
function updateFireflies(dt, isNight){
  if (isNight && !celebratingKey && fireflies.length < 8 && performance.now() >= nextFireflyAt){
    spawnFirefly();
    nextFireflyAt = performance.now() + rand(600,1600);
  }
  for (let i=fireflies.length-1;i>=0;i--){
    const f = fireflies[i];
    f.life += dt; f.phase += dt*3;
    if (!isNight || f.life >= f.maxLife){ fireflies.splice(i,1); continue; }
    f.vx += rand(-10,10)*dt; f.vy += rand(-10,10)*dt;
    f.vx = Math.max(-14, Math.min(14, f.vx));
    f.vy = Math.max(-10, Math.min(10, f.vy));
    f.x += f.vx*dt; f.y += f.vy*dt;
    f.y = Math.max(groundY-90, Math.min(groundY-4, f.y));
  }
}
function drawFireflies(){
  for (const f of fireflies){
    const glow = 0.5 + 0.5*Math.abs(Math.sin(f.phase));
    ctx.fillStyle = `rgba(230,255,140,${(0.5*glow).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,200,${glow.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, Math.PI*2); ctx.fill();
    registerClickTarget(f.x, f.y, 14, () => {
      const idx = fireflies.indexOf(f);
      if (idx >= 0) fireflies.splice(idx, 1);
      spawnSparkle(f.x, f.y, '#f4ffb0');
      showToast(f.x, f.y - 14, '✨ Caught a firefly!');
    });
  }
}

/* ---------- shooting stars (nighttime) ---------- */
const shootingStars = [];
let nextShootingStarAt = performance.now() + rand(8000,20000);
function updateShootingStars(dt, isNight){
  if (isNight && !celebratingKey && shootingStars.length === 0 && performance.now() >= nextShootingStarAt){
    const dir = Math.random() < 0.5 ? 1 : -1;
    shootingStars.push({
      x: dir>0 ? -20 : W+20, y: rand(H*0.05, H*0.3),
      vx: dir*rand(400,600), vy: rand(120,200),
      life: 0, maxLife: 0.9,
    });
    nextShootingStarAt = performance.now() + rand(10000,26000);
  }
  for (let i=shootingStars.length-1;i>=0;i--){
    const s = shootingStars[i];
    s.life += dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
    if (s.life >= s.maxLife || !isNight) shootingStars.splice(i,1);
  }
}
function drawShootingStars(){
  for (const s of shootingStars){
    const alpha = Math.max(0, 1 - s.life/s.maxLife);
    const dx = -s.vx*0.05, dy = -s.vy*0.05;
    ctx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x+dx, s.y+dy);
    ctx.stroke();
    registerClickTarget(s.x, s.y, 26, () => {
      const idx = shootingStars.indexOf(s);
      if (idx >= 0) shootingStars.splice(idx, 1);
      spawnSparkle(s.x, s.y, '#dff0ff');
      showToast(s.x, s.y - 14, '🌠 Wished on a star!');
    });
  }
}

/* ---------- distant bell tower (background scenery) ---------- */
const BELL_TOWER_PERIOD = 1500;
let bellSwing = 0, bellSwingVel = 0;
function ringBell(){
  bellSwingVel = 3.2;
}
function updateBellTower(dt){
  bellSwingVel -= bellSwing * 18 * dt;
  bellSwingVel *= (1 - 2.2*dt);
  bellSwing += bellSwingVel*dt;
}
function drawBellTower(){
  const factor = 0.20;
  const baseY = groundY + 24;
  const off = ((scroll*factor) % BELL_TOWER_PERIOD + BELL_TOWER_PERIOD) % BELL_TOWER_PERIOD;
  for (let rep = -off - BELL_TOWER_PERIOD; rep < W + BELL_TOWER_PERIOD; rep += BELL_TOWER_PERIOD){
    const tx = rep + BELL_TOWER_PERIOD*0.5;
    if (tx < -60 || tx > W+60) continue;
    const towerH = 110, towerW = 26;
    ctx.fillStyle = 'rgba(50,45,55,0.85)';
    ctx.fillRect(tx-towerW/2, baseY-towerH, towerW, towerH);
    ctx.beginPath();
    ctx.moveTo(tx-towerW/2-4, baseY-towerH);
    ctx.lineTo(tx, baseY-towerH-26);
    ctx.lineTo(tx+towerW/2+4, baseY-towerH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(20,18,24,0.9)';
    ctx.beginPath();
    ctx.arc(tx, baseY-towerH+18, 8, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(tx-8, baseY-towerH+18, 16, 14);
    ctx.save();
    ctx.translate(tx, baseY-towerH+20);
    ctx.rotate(bellSwing);
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(4, 9); ctx.lineTo(-4, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    registerClickTarget(tx, baseY-towerH+20, 30, () => {
      ringBell();
      spawnSparkle(tx, baseY-towerH+10, '#f4dfa0');
      showToast(tx, baseY-towerH-6, '🔔 Ding dong!');
    });
  }
}

/* ---------- sky (time-of-day gradient) ---------- */
function hexLerp(a,b,t){
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const SKY_KEYFRAMES = [
  [0,   '#0b1130','#1b2a52'],
  [5,   '#0b1130','#1b2a52'],
  [6.5, '#ff9a76','#ffd9a0'],
  [8,   '#6fb8ff','#cfeeff'],
  [16,  '#5aa8ff','#cfeeff'],
  [18.5,'#ff8a5c','#ffd39b'],
  [20,  '#241a4a','#5a3a6a'],
  [22,  '#0b1130','#1b2a52'],
  [24,  '#0b1130','#1b2a52'],
];
function skyColors(){
  const now = new Date();
  const t = now.getHours() + now.getMinutes()/60;
  for (let i=0;i<SKY_KEYFRAMES.length-1;i++){
    const [t0,top0,bot0] = SKY_KEYFRAMES[i];
    const [t1,top1,bot1] = SKY_KEYFRAMES[i+1];
    if (t>=t0 && t<=t1){
      const f = (t-t0)/(t1-t0);
      return { top: hexLerp(top0,top1,f), bottom: hexLerp(bot0,bot1,f), night: (t<6.5||t>18.5) };
    }
  }
  return { top: SKY_KEYFRAMES[0][1], bottom: SKY_KEYFRAMES[0][2], night: true };
}
const starDots = Array.from({length:60}, () => ({ x: Math.random(), y: Math.random()*0.7, r: rand(0.6,1.6), tw: rand(0,6.28) }));

function drawSky(sky){
  const g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,groundY);
  if (sky.night){
    ctx.fillStyle = '#fff';
    for (const s of starDots){
      const a = 0.4 + 0.6*Math.abs(Math.sin(s.tw + scroll*0.01));
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*groundY, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- parallax helpers ---------- */
function tiled(period, factor, drawFn){
  const off = ((scroll*factor) % period + period) % period;
  for (let x = -off - period; x < W + period; x += period) drawFn(x, period);
}

/* ---------- cloud system (independent of character scroll) ---------- */
let cloudTime = 0;
const CLOUD_WIND = 18;  // base px/sec drift

function seededRand(seed){
  let s = seed;
  return function(){ s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

const clouds = [];
function initClouds(){
  clouds.length = 0;
  const rng = seededRand(42);
  for (let i = 0; i < 14; i++){
    const layer = i < 5 ? 0 : (i < 10 ? 1 : 2); // 0=high/slow, 1=mid, 2=low/fast
    const baseSpeed = [0.4, 0.7, 1.0][layer];
    const baseY = [0.08, 0.18, 0.30][layer];
    const baseScale = [0.6, 0.85, 1.1][layer];
    const baseAlpha = [0.35, 0.55, 0.7][layer];
    const blobCount = 3 + Math.floor(rng() * 4);
    const blobs = [];
    for (let b = 0; b < blobCount; b++){
      blobs.push({
        ox: (rng() - 0.3) * 70 * baseScale,
        oy: (rng() - 0.5) * 18 * baseScale,
        rx: (14 + rng() * 28) * baseScale,
        ry: (8 + rng() * 12) * baseScale,
      });
    }
    clouds.push({
      x: rng() * 2400,
      y: baseY + (rng() - 0.5) * 0.06,
      speed: CLOUD_WIND * baseSpeed * (0.7 + rng() * 0.6),
      alpha: baseAlpha * (0.7 + rng() * 0.6),
      blobs: blobs,
      wrap: 2400,
    });
  }
}
initClouds();

function drawClouds(){
  for (const c of clouds){
    const screenY = c.y * groundY;
    const screenX = ((c.x - cloudTime * c.speed) % c.wrap + c.wrap) % c.wrap;
    // draw at screenX and screenX - wrap so clouds tile seamlessly
    for (let rep = screenX - c.wrap; rep < W + 120; rep += c.wrap){
      ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
      ctx.beginPath();
      for (const b of c.blobs){
        ctx.moveTo(rep + b.ox + b.rx, screenY + b.oy);
        ctx.ellipse(rep + b.ox, screenY + b.oy, b.rx, b.ry, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }
}

/* ---------- simple parallax hills ---------- */
function drawHills(){
  ctx.fillStyle = 'rgba(20,50,30,0.55)';
  tiled(340, 0.20, (x,p) => {
    ctx.beginPath();
    ctx.ellipse(x+p*0.5, groundY+24, p*0.62, 60, 0, Math.PI, 0);
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(30,70,40,0.6)';
  tiled(260, 0.35, (x,p) => {
    ctx.beginPath();
    ctx.ellipse(x+p*0.5, groundY+18, p*0.6, 46, 0, Math.PI, 0);
    ctx.fill();
  });
}

/* ---------- ground ---------- */
function drawGround(){
  // base grass
  ctx.fillStyle = '#2f6b3a';
  ctx.fillRect(0, groundY, W, H - groundY);

  // path/trail
  ctx.fillStyle = '#8a7650';
  ctx.fillRect(0, groundY + 4, W, 14);
  ctx.fillStyle = '#7d6a48';
  ctx.fillRect(0, groundY + 7, W, 8);

  // grass tufts
  ctx.fillStyle = '#3c8246';
  tiled(42, 1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, groundY + 20);
    ctx.lineTo(x + 11, groundY + 8);
    ctx.lineTo(x + 14, groundY + 20);
    ctx.fill();
  });

  // second grass layer
  ctx.fillStyle = '#327837';
  tiled(63, 1.1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 4, groundY + 22);
    ctx.lineTo(x + 7, groundY + 13);
    ctx.lineTo(x + 10, groundY + 22);
    ctx.fill();
  });

  // wildflowers
  tiled(97, 1, (x) => {
    ctx.fillStyle = '#f2c94c';
    ctx.beginPath(); ctx.arc(x + 30, groundY + 28, 2.4, 0, 7); ctx.fill();
  });
  tiled(131, 1, (x) => {
    ctx.fillStyle = '#e87fa0';
    ctx.beginPath(); ctx.arc(x + 50, groundY + 32, 2.0, 0, 7); ctx.fill();
  });
  tiled(173, 1, (x) => {
    ctx.fillStyle = '#a7d8f0';
    ctx.beginPath(); ctx.arc(x + 20, groundY + 26, 1.8, 0, 7); ctx.fill();
  });
}

/* ---------- foreground grass (closest layer, in front of character, bottom of view) ---------- */
function drawForegroundGrass(){
  const bottom = H;
  ctx.fillStyle = '#286e32';
  tiled(30, 1.3, (x) => {
    ctx.beginPath();
    ctx.moveTo(x, bottom);
    ctx.lineTo(x + 5, bottom - 45);
    ctx.lineTo(x + 10, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#1f5a28';
  tiled(44, 1.5, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, bottom);
    ctx.lineTo(x + 13, bottom - 55);
    ctx.lineTo(x + 18, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#37823c';
  tiled(52, 1.4, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 3, bottom);
    ctx.lineTo(x + 7, bottom - 35);
    ctx.lineTo(x + 11, bottom);
    ctx.fill();
  });
}

/* ---------- Krystal ---------- */
function drawKrystal(){
  const feetX = W*feetXFrac, dispH = dispHeight();
  const bob = state==='walk' ? Math.abs(Math.sin(scroll*0.045))*3 : 0;

  if (state === 'walk'){
    if (walkImg.complete && walkImg.naturalWidth){
      const fw = walkImg.naturalWidth/WALK_COLS, fh = walkImg.naturalHeight/WALK_ROWS;
      const dispW = dispH*(fw/fh);
      const foot = WALK_FOOT*dispH;
      ctx.drawImage(walkImg, walkFrame*fw, WALK_ROW_RIGHT*fh, fw, fh,
                    feetX-dispW/2, groundY+10-dispH+foot-bob, dispW, dispH);
    }
  } else {
    const img = exprImgs[currentExpr];
    if (img && img.complete && img.naturalWidth){
      const fw = img.naturalWidth/EXPR_COLS, fh = img.naturalHeight;
      const dispW = dispH*(fw/fh);
      const foot = EXPR_FOOT*dispH;
      ctx.drawImage(img, exprFrame*fw, 0, fw, fh,
                    feetX-dispW/2, groundY+10-dispH+foot, dispW, dispH);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(feetX, groundY+13, 22, 6, 0, 0, 7); ctx.fill();
}

/* ---------- loop ---------- */
function update(dt, isNight){
  // clouds drift independent of the character
  cloudTime += dt;
  updateFireworks(dt);
  updateSparkles(dt);
  updateToasts(dt);
  updateBellTower(dt);
  updateBirds(dt, isNight);
  updateButterflies(dt, isNight);
  updateFireflies(dt, isNight);
  updateShootingStars(dt, isNight);

  // Krystal always moves forward
  scroll += SPEED*dt;
  walkFrameTime += dt;
  if (walkFrameTime >= 1/WALK_FPS){ walkFrameTime -= 1/WALK_FPS; walkFrame = (walkFrame+1)%WALK_COLS; }

  if (state === 'walk'){
    if (celebratingKey && performance.now() >= recelebrateAt){
      if (currentFunKey() === celebratingKey) triggerCelebration(celebratingKey, FUN_TIMES[celebratingKey]);
      else celebratingKey = null;
    } else if (!celebratingKey && performance.now() >= nextRoutineAt){
      startRoutine();
    }
  } else {
    exprFrameTime += dt;
    if (exprFrameTime >= 1/EXPR_FPS){ exprFrameTime -= 1/EXPR_FPS; exprFrame = (exprFrame+1)%EXPR_COLS; }
    actionTimer -= dt;
    if (actionTimer <= 0) endAction();
  }
}

function draw(sky){
  clickTargets = [];
  drawSky(sky);
  drawShootingStars();
  drawClouds();
  drawBirds();
  drawHills();
  drawBellTower();
  drawGround();
  drawFireflies();
  drawKrystal();
  drawButterflies();
  drawForegroundGrass();
  drawFireworks();
  drawSparkles();
  drawToasts();
}

let last = performance.now();
let funTimeAccum = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  funTimeAccum += dt;
  if (funTimeAccum >= 1){ funTimeAccum = 0; checkFunTime(); }
  const sky = skyColors();
  update(dt, sky.night);
  draw(sky);
  requestAnimationFrame(loop);
}

resize();
checkFunTime();
requestAnimationFrame(loop);

/* ---------- debug (add ?debug to the URL) ---------- */
if (new URLSearchParams(location.search).has('debug')){
  const panel = document.getElementById('debugPanel');
  panel.classList.remove('hide');
  document.getElementById('debugGo').addEventListener('click', () => {
    const key = document.getElementById('debugKey').value.trim();
    if (key) triggerCelebration(key, FUN_TIMES[key] || 'Custom fun time!');
  });
  document.getElementById('debugRoutine').addEventListener('click', startRoutine);
}

</script>

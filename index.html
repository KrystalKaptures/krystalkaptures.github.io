  const dayPrefixes = ["s","m","t","w","th","f","s"];
  const today = new Date();

  document.getElementById('dayLabel').textContent = dayNames[dayIndex] + ' \u00b7 ' + today.toLocaleDateString();

  function matchesDay(word, dIndex){
    const w = word.toLowerCase();
    const prefix = dayPrefixes[dIndex];
    if (dIndex === 2) return w.startsWith('t') && !w.startsWith('th');
    return w.startsWith(prefix);
  }

  function fetchDefinition(word){
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
      .then(res => { if (!res.ok) throw new Error('No definition found'); return res.json(); })
      .then(data => {
        const meanings = data[0] && data[0].meanings;
        if (!meanings) throw new Error('No meanings in response');
        const adjMeaning = meanings.find(m => m.partOfSpeech === 'adjective') || meanings[0];
        const def = adjMeaning && adjMeaning.definitions && adjMeaning.definitions[0] && adjMeaning.definitions[0].definition;
        if (!def) throw new Error('No definition in response');
        const pos = adjMeaning.partOfSpeech ? adjMeaning.partOfSpeech + ' \u2014 ' : '';
        document.getElementById('subLabel').textContent = pos + def;
      })
      .catch(() => {
        document.getElementById('subLabel').textContent = '';
      });

    .then(res => { if (!res.ok) throw new Error('Bad response: ' + res.status); return res.text(); })

        .filter(w => w.length > 0 && /^[a-z][a-z-]*$/.test(w));

    })
    .catch(err => {
      console.warn('Falling back to built-in word list:', err);
      showWord(FALLBACK_ADJECTIVES_BY_DAY[dayIndex]);

/* ---------- jet flyover system ---------- */
const jets = [];          // active flyover groups
const JET_SMOKE_LIFE = 4; // seconds smoke lingers

function launchJets(){
  const originX = W * 0.5;
  const originY = groundY * 0.48;
  const krystalX = W * feetXFrac;
  const treeY = groundY * 0.78;
  const dur = 4.0;
  // Lead jet: flies over Krystal's head, pulls up
  jets.push({ startX: originX, startY: originY,
              endX: krystalX, endY: -H * 0.5,
              duration: dur, t: 0, breakDir: 0,
              smokeColor: 'rgba(220,40,40,', smoke: [],
              formOx: 0, formOy: 0 });
  // Right wingman: breaks off to the right
  jets.push({ startX: originX, startY: originY,
              endX: W + 200, endY: -H * 0.3,
              duration: dur, t: 0, breakDir: 1,
              smokeColor: 'rgba(255,255,255,', smoke: [],
              formOx: 12, formOy: -8 });
  // Left wingman: breaks off to the left
  jets.push({ startX: originX, startY: originY,
              endX: -200, endY: -H * 0.3,
              duration: dur, t: 0, breakDir: -1,
              smokeColor: 'rgba(40,80,220,', smoke: [],
              formOx: 12, formOy: 8 });
}

// Two-phase motion:
// Phase 1 (0–0.65): slow descent from mountains toward tree line
// Phase 2 (0.65–1): pull up hard and blast skyward
function jetYPath(p, startY, endY){
  const treeY = groundY * 0.78;  // where the foreground tree tops are
  if (p < 0.65){
    const t = p / 0.65;
    return startY + (treeY - startY) * t * t;   // slow approach down to trees
  }
  const t = (p - 0.65) / 0.35;
  return treeY + (endY - treeY) * t * t;         // pull up fast toward sky
}
function jetScale(p){
  if (p < 0.65){
    const t = p / 0.65;
    return 0.15 + t * t * 1.8;   // small → medium through the layers
  }
  const t = (p - 0.65) / 0.35;
  return 1.95 + t * 4;           // big as they pull up past us
}

function jetPos(j, p){
  const scale = jetScale(p);
  if (p < 0.65){
    // formation phase: all fly together, offset by formOx/formOy
    const t = p / 0.65;
    const leaderX = j.startX;
    const leaderY = j.startY + (groundY * 0.78 - j.startY) * t * t;
    return { x: leaderX + j.formOx * scale, y: leaderY + j.formOy * scale, scale };
  }
  // breakoff phase: each jet goes to its own endX/endY
  const bt = (p - 0.65) / 0.35;
  const breakStartX = j.startX + j.formOx * jetScale(0.65);
  const breakStartY = groundY * 0.78 + j.formOy * jetScale(0.65);
  const x = breakStartX + (j.endX - breakStartX) * bt * bt;
  const y = breakStartY + (j.endY - breakStartY) * bt * bt;
  return { x, y, scale };
}

function updateJets(dt){
  for (let g = jets.length - 1; g >= 0; g--){
    const j = jets[g];
    j.t += dt;
    const p = Math.min(j.t / j.duration, 1);
    const pos = jetPos(j, p);
    j.smoke.push({ x: pos.x, y: pos.y, color: j.smokeColor, age: 0, scale: pos.scale });
    // age smoke
    for (let s = j.smoke.length - 1; s >= 0; s--){
      j.smoke[s].age += dt;
      if (j.smoke[s].age > JET_SMOKE_LIFE) j.smoke.splice(s, 1);
    }
    if (p >= 1 && j.smoke.length === 0) jets.splice(g, 1);
  }
}

function drawJets(){
  for (const j of jets){
    // draw smoke trail
    for (const s of j.smoke){
      const alpha = Math.max(0, 0.45 * (1 - s.age / JET_SMOKE_LIFE));
      const r = s.scale * 1.5 + s.age * 4;
      ctx.fillStyle = s.color + alpha + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // draw jet if still flying
    const p = Math.min(j.t / j.duration, 1);
    if (p >= 1) continue;
    const pos = jetPos(j, p);
    const dp = 0.005;
    const pos2 = jetPos(j, Math.min(p + dp, 1));
    const angle = Math.atan2(pos2.y - pos.y, pos2.x - pos.x);

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(angle);
    ctx.scale(pos.scale, pos.scale);
    // jet body
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-8, -3);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-8, 3);
    ctx.closePath();
    ctx.fill();
    // wings
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.lineTo(-4, -7);
    ctx.lineTo(-6, -6);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-6, 6);
    ctx.lineTo(-4, 7);
    ctx.closePath();
    ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-10, -4);
    ctx.lineTo(-10, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

const feetXFrac = 0.24;

function dispHeight(){ return Math.max(100, Math.min(150, H*0.18)); }

function positionBubble(){
  bubble.style.left = (W*feetXFrac) + 'px';
  bubble.style.top = (groundY - dispHeight() - 6) + 'px';

/* ---------- fun-time celebration ---------- */
function triggerCelebration(key, reason){
  celebratingKey = key;
  state = 'celebrate';
  actionTimer = 10;
  currentExpr = pick(CELEBRATE_POOL);
  exprFrame = 0; exprFrameTime = 0;
  bubble.textContent = `⏰ ${key} — ${reason}`;
  positionBubble();
  bubble.classList.add('show');
  burstConfetti();
  launchJets();
}

function startRoutine(){
  if (state !== 'walk') return;
  state = 'routine';
  actionTimer = 2.6;
  currentExpr = pick(ROUTINE_POOL);
  exprFrame = 0; exprFrameTime = 0;
}

function currentFunKey(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  return `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function endAction(){
  if (state === 'celebrate' && celebratingKey && currentFunKey() === celebratingKey){
    // still the same fun minute — take a brief break, then celebrate again
    state = 'walk';
    bubble.classList.remove('show');
    recelebrateAt = performance.now() + 5000;
    return;
  }
  celebratingKey = null;
  state = 'walk';
  bubble.classList.remove('show');
  nextRoutineAt = performance.now() + rand(18000,32000);
}

function checkFunTime(){
  const now = new Date();
  const h12 = (now.getHours() % 12) || 12;
  const key = `${h12}:${String(now.getMinutes()).padStart(2,'0')}`;
  clockChip.textContent = `${h12}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()>=12?'PM':'AM'}`;
  if (key !== lastFunKey){
    lastFunKey = key;
    const reason = FUN_TIMES[key];
    if (reason) triggerCelebration(key, reason);
  }
}

/* ---------- sky (time-of-day gradient) ---------- */
function hexLerp(a,b,t){
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const SKY_KEYFRAMES = [
  [0,   '#0b1130','#1b2a52'],
  [5,   '#0b1130','#1b2a52'],
  [6.5, '#ff9a76','#ffd9a0'],
  [8,   '#6fb8ff','#cfeeff'],
  [16,  '#5aa8ff','#cfeeff'],
  [18.5,'#ff8a5c','#ffd39b'],
  [20,  '#241a4a','#5a3a6a'],
  [22,  '#0b1130','#1b2a52'],
  [24,  '#0b1130','#1b2a52'],
];
function skyColors(){
  const now = new Date();
  const t = now.getHours() + now.getMinutes()/60;
  for (let i=0;i<SKY_KEYFRAMES.length-1;i++){
    const [t0,top0,bot0] = SKY_KEYFRAMES[i];
    const [t1,top1,bot1] = SKY_KEYFRAMES[i+1];
    if (t>=t0 && t<=t1){
      const f = (t-t0)/(t1-t0);
      return { top: hexLerp(top0,top1,f), bottom: hexLerp(bot0,bot1,f), night: (t<6.5||t>18.5) };
    }
  }
  return { top: SKY_KEYFRAMES[0][1], bottom: SKY_KEYFRAMES[0][2], night: true };
}
const starDots = Array.from({length:60}, () => ({ x: Math.random(), y: Math.random()*0.7, r: rand(0.6,1.6), tw: rand(0,6.28) }));

function drawSky(sky){
  const g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bottom);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,groundY);
  if (sky.night){
    ctx.fillStyle = '#fff';
    for (const s of starDots){
      const a = 0.4 + 0.6*Math.abs(Math.sin(s.tw + scroll*0.01));
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*groundY, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- parallax helpers ---------- */
function tiled(period, factor, drawFn){
  const off = ((scroll*factor) % period + period) % period;
  for (let x = -off - period; x < W + period; x += period) drawFn(x, period);
}

/* ---------- cloud system (independent of character scroll) ---------- */
let cloudTime = 0;
const CLOUD_WIND = 18;  // base px/sec drift

function seededRand(seed){
  let s = seed;
  return function(){ s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

const clouds = [];
function initClouds(){
  clouds.length = 0;
  const rng = seededRand(42);
  for (let i = 0; i < 14; i++){
    const layer = i < 5 ? 0 : (i < 10 ? 1 : 2); // 0=high/slow, 1=mid, 2=low/fast
    const baseSpeed = [0.4, 0.7, 1.0][layer];
    const baseY = [0.08, 0.18, 0.30][layer];
    const baseScale = [0.6, 0.85, 1.1][layer];
    const baseAlpha = [0.35, 0.55, 0.7][layer];
    const blobCount = 3 + Math.floor(rng() * 4);
    const blobs = [];
    for (let b = 0; b < blobCount; b++){
      blobs.push({
        ox: (rng() - 0.3) * 70 * baseScale,
        oy: (rng() - 0.5) * 18 * baseScale,
        rx: (14 + rng() * 28) * baseScale,
        ry: (8 + rng() * 12) * baseScale,
      });
    }
    clouds.push({
      x: rng() * 2400,
      y: baseY + (rng() - 0.5) * 0.06,
      speed: CLOUD_WIND * baseSpeed * (0.7 + rng() * 0.6),
      alpha: baseAlpha * (0.7 + rng() * 0.6),
      blobs: blobs,
      wrap: 2400,
    });
  }
}
initClouds();

function drawClouds(){
  for (const c of clouds){
    const screenY = c.y * groundY;
    const screenX = ((c.x - cloudTime * c.speed) % c.wrap + c.wrap) % c.wrap;
    // draw at screenX and screenX - wrap so clouds tile seamlessly
    for (let rep = screenX - c.wrap; rep < W + 120; rep += c.wrap){
      ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
      ctx.beginPath();
      for (const b of c.blobs){
        ctx.moveTo(rep + b.ox + b.rx, screenY + b.oy);
        ctx.ellipse(rep + b.ox, screenY + b.oy, b.rx, b.ry, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
  }
}

/* ---------- airplane system (contrails + flashing lights) ---------- */
const airplanes = [];

function spawnAirplane(scatter){
  const goRight = Math.random() < 0.5;
  const y = 0.04 + Math.random() * 0.35;
  const speed = 25 + Math.random() * 55;
  const hasContrail = Math.random() < 0.4;
  const contrailLen = 60 + Math.random() * 140;
  const a = {
    x: goRight ? -contrailLen - 30 : W + 30,
    y,
    speed: goRight ? speed : -speed,
    hasContrail,
    contrailLen,
    flashPhase: Math.random() * Math.PI * 2,
    flashSpeed: 2 + Math.random() * 3,
    size: 1.5 + Math.random() * 1.5,
  };
  if (scatter) a.x = Math.random() * (W + 200) - 100;
  return a;
}

function initAirplanes(){
  airplanes.length = 0;
  for (let i = 0; i < 5; i++) airplanes.push(spawnAirplane(true));
}
initAirplanes();

function updateAirplanes(dt){
  for (let i = 0; i < airplanes.length; i++){
    const a = airplanes[i];
    a.x += a.speed * dt;
    if ((a.speed > 0 && a.x > W + 250) || (a.speed < 0 && a.x < -250)){
      airplanes[i] = spawnAirplane(false);
    }
  }
}

function drawAirplanes(isNight){
  const now = performance.now() / 1000;
  for (const a of airplanes){
    const sy = a.y * groundY;
    const sx = a.x;

    // contrail
    if (a.hasContrail){
      const dir = a.speed > 0 ? -1 : 1;
      const tailX = sx + dir * a.contrailLen;
      const grad = ctx.createLinearGradient(sx, sy, tailX, sy);
      grad.addColorStop(0, 'rgba(255,255,255,0.45)');
      grad.addColorStop(0.6, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(tailX, sy);
      ctx.stroke();
      // second parallel trail (twin engine)
      if (a.size > 2){
        ctx.beginPath();
        ctx.moveTo(sx, sy + 2.5);
        ctx.lineTo(tailX, sy + 2.5);
        ctx.stroke();
      }
    }

    // airplane
    if (isNight){
      // always-on dim nav light
      ctx.fillStyle = 'rgba(255,100,100,0.25)';
      ctx.beginPath();
      ctx.arc(sx, sy, a.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
      // alternating white strobe / red beacon
      const flash = Math.sin(now * a.flashSpeed + a.flashPhase);
      if (flash > 0.3){
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(sx, sy, a.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (flash < -0.3){
        ctx.fillStyle = 'rgba(255,40,40,0.8)';
        ctx.beginPath();
        ctx.arc(sx, sy, a.size * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // daytime: silver glint
      ctx.fillStyle = 'rgba(220,220,235,0.85)';
      ctx.beginPath();
      ctx.arc(sx, sy, a.size, 0, Math.PI * 2);
      ctx.fill();
      // tiny wing flash
      const glint = Math.sin(now * 1.5 + a.flashPhase);
      if (glint > 0.7){
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(sx, sy, a.size * 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

/* ---------- terrain height profile generator ---------- */
/* Builds a profile from a chain of wave segments. Each segment is a
   cosine-interpolated arc between two knot heights. Segments have random
   widths and random heights, but each segment's end connects seamlessly
   to the next segment's start. The last knot wraps to the first for tiling. */
function generateProfile(seed, numKnots, samples, minH, maxH){
  const rng = seededRand(seed);

  // generate knots with random spacing and random heights
  const knots = [];
  let totalW = 0;
  for (let i = 0; i < numKnots; i++){
    const w = 0.4 + rng() * 1.6;           // random segment width (weight)
    const h = minH + rng() * (maxH - minH); // random height
    knots.push({ w, h });
    totalW += w;
  }
  // normalize widths to sum to 1
  for (const k of knots) k.w /= totalW;
  // wrap: last knot height = first knot height so the profile tiles
  knots[knots.length - 1].h = knots[0].h;

  // build cumulative x positions for knot boundaries
  const boundaries = [{ x: 0, h: knots[0].h }];
  let cx = 0;
  for (let i = 0; i < knots.length; i++){
    cx += knots[i].w;
    boundaries.push({ x: cx, h: knots[(i + 1) % knots.length].h });
  }

  // each segment gets a random phase offset within the cosine cycle
  // so some arcs are asymmetric (steeper on one side)
  const phaseOffsets = knots.map(() => (rng() - 0.5) * 0.6);

  // sample the profile at even intervals
  const heights = [];
  let ki = 0;
  for (let i = 0; i <= samples; i++){
    const t = i / samples;
    while (ki < boundaries.length - 2 && t > boundaries[ki + 1].x) ki++;
    const b0 = boundaries[ki];
    const b1 = boundaries[ki + 1];
    const segW = b1.x - b0.x;
    const localT = segW > 0 ? (t - b0.x) / segW : 0;
    // cosine interpolation with phase offset for asymmetry
    const phase = phaseOffsets[ki % phaseOffsets.length];
    const skewed = Math.max(0, Math.min(1, localT + phase * localT * (1 - localT)));
    const cosT = (1 - Math.cos(skewed * Math.PI)) / 2;
    heights.push(b0.h + (b1.h - b0.h) * cosT);
  }
  return heights;
}

/* Draw one solid terrain layer: curved profile on top, solid fill to groundY */
function drawTerrainLayer(color, profile, period, factor, baseY, heightScale){
  ctx.fillStyle = color;
  const samples = profile.length - 1;
  const off = ((scroll * factor) % period + period) % period;

  for (let rep = -off - period; rep < W + period; rep += period){
    ctx.beginPath();
    ctx.moveTo(rep, groundY + 2);
    ctx.lineTo(rep, baseY);
    for (let i = 0; i <= samples; i++){
      const px = rep + (i / samples) * period;
      const py = baseY - Math.max(0, profile[i]) * heightScale;
      if (i === 0) ctx.lineTo(px, py);
      else {
        const prevX = rep + ((i - 1) / samples) * period;
        const prevY = baseY - Math.max(0, profile[i - 1]) * heightScale;
        const cpx = (prevX + px) / 2;
        ctx.bezierCurveTo(cpx, prevY, cpx, py, px, py);
      }
    }
    ctx.lineTo(rep + period, baseY);
    ctx.lineTo(rep + period, groundY + 2);
    ctx.closePath();
    ctx.fill();
  }
}

/* ---------- suburb layers (small houses, spaced out) ---------- */
const suburbDefs = [];

function initSuburbs(){
  suburbDefs.length = 0;
  const configs = [
    { period: 3000, factor: 0.26, baseYFrac: 0.83, terrainIdx: 0, hScale: 6, count: 65, terrainColor: '#4e6440' },
    { period: 2600, factor: 0.28, baseYFrac: 0.84, terrainIdx: 1, hScale: 7, count: 58, terrainColor: '#4a6038' },
    { period: 2200, factor: 0.30, baseYFrac: 0.86, terrainIdx: 2, hScale: 7, count: 52, terrainColor: '#465c34' },
    { period: 1900, factor: 0.32, baseYFrac: 0.87, terrainIdx: 3, hScale: 8, count: 48, terrainColor: '#3e5830' },
  ];
  const houseColors = ['#5e5650','#6a5a4a','#5a4e42','#4e4840','#6e6050','#5a5048','#625848','#584e46','#6a6258','#786858'];
  const roofColors = ['#3a3230','#4a3a30','#2e2826','#3e3430','#5a4a3a','#322c2a','#4a4038','#3a3028'];
  for (const cfg of configs){
    const houses = [];
    const spacing = cfg.period / cfg.count;
    for (let i = 0; i < cfg.count; i++){
      const x = i * spacing + Math.random() * spacing * 0.4;
      const w = 8 + Math.random() * 12;
      const h = 7 + Math.random() * 10;
      const roofH = h * (0.25 + Math.random() * 0.3);
      const bodyColor = houseColors[Math.floor(Math.random() * houseColors.length)];
      const roofColor = roofColors[Math.floor(Math.random() * roofColors.length)];
      const wSize = 1.5 + Math.random() * 1;
      const windows = [];
      const winCount = 1 + Math.floor(Math.random() * 3);
      for (let wi = 0; wi < winCount; wi++){
        windows.push({ dx: (wi + 1) * w / (winCount + 1) - wSize / 2, dy: h * (0.2 + Math.random() * 0.2) });
      }
      houses.push({ x, w, h, roofH, windows, wSize, bodyColor, roofColor });
    }
    // cell/radio towers — clear houses in a gap around each
    const towers = [];
    const towerCount = Math.random() < 0.25 ? 1 : 0;
    for (let ti = 0; ti < towerCount; ti++){
      const tx = cfg.period * (0.15 + Math.random() * 0.7);
      const tH = 300 + Math.random() * 120;
      const gap = 50 + Math.random() * 30;
      towers.push({ x: tx, h: tH, flashPhase: Math.random() * Math.PI * 2 });
      // remove houses within the gap
      for (let hi = houses.length - 1; hi >= 0; hi--){
        if (Math.abs(houses[hi].x - tx) < gap) houses.splice(hi, 1);
      }
    }
    // rare free-standing water towers
    const waterTowers = [];
    const wtCount = Math.random() < 0.5 ? 1 : (Math.random() < 0.3 ? 2 : 0);
    const wtTypes = ['sphere','mushroom','standpipe','multileg','pedesphere','compositeleg','fluted','ufo','smoothdome'];
    for (let wi = 0; wi < wtCount; wi++){
      const wx = cfg.period * (0.1 + Math.random() * 0.8);
      const wType = wtTypes[Math.floor(Math.random() * wtTypes.length)];
      const legH = 45 + Math.random() * 25;
      const tankR = 8 + Math.random() * 6;
      const bodyColor = ['#6a8aaa','#5a7a9a','#7a9aba','#8aaaca','#5080a8','#4a7090','#8a8a82','#9a9a92'][Math.floor(Math.random() * 8)];
      waterTowers.push({ x: wx, type: wType, legH, tankR, bodyColor });
      for (let hi = houses.length - 1; hi >= 0; hi--){
        if (Math.abs(houses[hi].x - wx) < 25) houses.splice(hi, 1);
      }
    }
    suburbDefs.push({ ...cfg, houses, towers, waterTowers });
  }
}
initSuburbs();

function drawSuburbs(){
  for (const layer of suburbDefs){
    const baseY = groundY * layer.baseYFrac;
    const prof = suburbTerrainProfiles[layer.terrainIdx];
    drawTerrainLayer(layer.terrainColor, prof, layer.period, layer.factor, baseY, layer.hScale);

    const off = ((scroll * layer.factor) % layer.period + layer.period) % layer.period;
    for (let rep = -off - layer.period; rep < W + layer.period; rep += layer.period){
      for (const h of layer.houses){
        const hx = rep + h.x;
        if (hx + h.w < -5 || hx > W + 5) continue;
        const th = profileHeightAt(prof, h.x / layer.period) * layer.hScale;
        const surfaceY = baseY - th;
        ctx.fillStyle = h.bodyColor;
        ctx.fillRect(hx, surfaceY - h.h, h.w, h.h);
        ctx.fillStyle = h.roofColor;
        ctx.beginPath();
        ctx.moveTo(hx - 2, surfaceY - h.h);
        ctx.lineTo(hx + h.w / 2, surfaceY - h.h - h.roofH);
        ctx.lineTo(hx + h.w + 2, surfaceY - h.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,216,110,0.15)';
        for (const win of h.windows){
          ctx.fillRect(hx + win.dx, surfaceY - h.h + win.dy, h.wSize, h.wSize);
        }
      }
      // cell/radio towers
      const now = performance.now() / 1000;
      for (const tw of layer.towers){
        const tx = rep + tw.x;
        if (tx < -20 || tx > W + 20) continue;
        const th = profileHeightAt(prof, tw.x / layer.period) * layer.hScale;
        const surfaceY = baseY - th;
        // lattice tower structure
        ctx.strokeStyle = '#5a5a5a';
        ctx.lineWidth = 1.2;
        // main legs (tapered)
        const topW = 3;
        const botW = 16;
        ctx.beginPath();
        ctx.moveTo(tx - botW / 2, surfaceY);
        ctx.lineTo(tx - topW / 2, surfaceY - tw.h);
        ctx.moveTo(tx + botW / 2, surfaceY);
        ctx.lineTo(tx + topW / 2, surfaceY - tw.h);
        ctx.stroke();
        // cross bracing
        ctx.lineWidth = 0.6;
        ctx.strokeStyle = '#4a4a4a';
        ctx.beginPath();
        const braceStep = 8;
        for (let by = 0; by < tw.h; by += braceStep){
          const t1 = by / tw.h;
          const t2 = Math.min(1, (by + braceStep) / tw.h);
          const lw1 = botW / 2 - (botW - topW) / 2 * t1;
          const lw2 = botW / 2 - (botW - topW) / 2 * t2;
          ctx.moveTo(tx - lw1, surfaceY - by);
          ctx.lineTo(tx + lw2, surfaceY - by - braceStep);
          ctx.moveTo(tx + lw1, surfaceY - by);
          ctx.lineTo(tx - lw2, surfaceY - by - braceStep);
        }
        ctx.stroke();
        // antenna mast at top
        ctx.fillStyle = '#6a6a6a';
        ctx.fillRect(tx - 0.5, surfaceY - tw.h - 8, 1, 8);
        // support cables at multiple heights
        ctx.strokeStyle = 'rgba(90,90,90,0.35)';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        const cableHeights = [0.85, 0.65, 0.40];
        const cableSpans = [80, 60, 40];
        for (let ci = 0; ci < cableHeights.length; ci++){
          const cy = surfaceY - tw.h * cableHeights[ci];
          const span = cableSpans[ci];
          ctx.moveTo(tx, cy);
          ctx.lineTo(tx - span, surfaceY);
          ctx.moveTo(tx, cy);
          ctx.lineTo(tx + span, surfaceY);
        }
        ctx.stroke();
        // flashing red light
        const flash = Math.sin(now * 2.5 + tw.flashPhase);
        if (flash > -0.2){
          const glow = 0.4 + 0.6 * Math.max(0, flash);
          ctx.fillStyle = `rgba(255,20,20,${glow.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(tx, surfaceY - tw.h - 8, 2, 0, Math.PI * 2);
          ctx.fill();
          // glow halo
          if (flash > 0.3){
            ctx.fillStyle = `rgba(255,40,40,${(glow * 0.25).toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(tx, surfaceY - tw.h - 8, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      // suburb water towers
      for (const wt of layer.waterTowers){
        const wtx = rep + wt.x;
        if (wtx < -20 || wtx > W + 20) continue;
        const th = profileHeightAt(prof, wt.x / layer.period) * layer.hScale;
        const surfaceY = baseY - th;
        const lh = wt.legH, tr = wt.tankR;
        ctx.fillStyle = wt.bodyColor;
        ctx.strokeStyle = wt.bodyColor;
        ctx.lineWidth = 1.5;
        if (wt.type === 'sphere'){
          // single thick column + sphere on top
          ctx.fillRect(wtx - 2, surfaceY - lh, 4, lh);
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr, tr, 0, Math.PI * 2);
          ctx.fill();
        } else if (wt.type === 'mushroom'){
          // narrow stem + wide flat-bottom bowl
          ctx.fillRect(wtx - 1.5, surfaceY - lh, 3, lh);
          ctx.beginPath();
          ctx.ellipse(wtx, surfaceY - lh - tr * 0.4, tr * 1.3, tr * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(wtx - tr * 0.3, surfaceY - lh - tr, tr * 0.6, 2);
        } else if (wt.type === 'standpipe'){
          // tall narrow cylinder
          const sw = tr * 0.6;
          ctx.fillRect(wtx - sw, surfaceY - lh - tr * 2, sw * 2, lh + tr * 2);
          // cap
          ctx.beginPath();
          ctx.ellipse(wtx, surfaceY - lh - tr * 2, sw, sw * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (wt.type === 'multileg'){
          // 3-4 legs + tank
          ctx.beginPath();
          ctx.moveTo(wtx - 5, surfaceY);
          ctx.lineTo(wtx - 2, surfaceY - lh);
          ctx.moveTo(wtx + 5, surfaceY);
          ctx.lineTo(wtx + 2, surfaceY - lh);
          ctx.moveTo(wtx - 1, surfaceY);
          ctx.lineTo(wtx, surfaceY - lh);
          ctx.stroke();
          // cross brace
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(wtx - 4, surfaceY - lh * 0.4);
          ctx.lineTo(wtx + 4, surfaceY - lh * 0.4);
          ctx.stroke();
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(wtx, surfaceY - lh - tr * 0.5, tr, tr * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (wt.type === 'pedesphere'){
          // pedestal column + sphere
          const pw = 3;
          ctx.fillRect(wtx - pw, surfaceY - lh, pw * 2, lh);
          // flared base
          ctx.beginPath();
          ctx.moveTo(wtx - pw - 2, surfaceY);
          ctx.lineTo(wtx - pw, surfaceY - 4);
          ctx.lineTo(wtx + pw, surfaceY - 4);
          ctx.lineTo(wtx + pw + 2, surfaceY);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr * 0.9, tr, 0, Math.PI * 2);
          ctx.fill();
          // cap nub
          ctx.fillRect(wtx - 1, surfaceY - lh - tr * 1.8 - 3, 2, 3);
        } else if (wt.type === 'compositeleg'){
          // concealed base: wide tapered concrete column hiding legs, sphere on top
          const bw = 5 + tr * 0.5;
          ctx.fillStyle = '#9a9a90';
          ctx.beginPath();
          ctx.moveTo(wtx - bw, surfaceY);
          ctx.lineTo(wtx - 2, surfaceY - lh);
          ctx.lineTo(wtx + 2, surfaceY - lh);
          ctx.lineTo(wtx + bw, surfaceY);
          ctx.closePath();
          ctx.fill();
          // sphere tank
          ctx.fillStyle = wt.bodyColor;
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr, tr, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(wtx - 1, surfaceY - lh - tr * 2 - 2, 2, 2);
        } else if (wt.type === 'fluted'){
          // concealed base: wide fluted column (like a wine glass), bowl on top
          const bw = 6 + tr * 0.4;
          ctx.fillStyle = '#9a9a90';
          // fluted column — curves inward then out
          ctx.beginPath();
          ctx.moveTo(wtx - bw, surfaceY);
          ctx.quadraticCurveTo(wtx - 1.5, surfaceY - lh * 0.6, wtx - 2.5, surfaceY - lh);
          ctx.lineTo(wtx + 2.5, surfaceY - lh);
          ctx.quadraticCurveTo(wtx + 1.5, surfaceY - lh * 0.6, wtx + bw, surfaceY);
          ctx.closePath();
          ctx.fill();
          // wide bowl tank
          ctx.fillStyle = wt.bodyColor;
          ctx.beginPath();
          ctx.ellipse(wtx, surfaceY - lh - tr * 0.5, tr * 1.4, tr * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
          // dome top
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr * 0.5 - tr * 0.6, tr * 0.6, Math.PI, 0);
          ctx.fill();
        } else if (wt.type === 'ufo'){
          // UFO/flying saucer shape on narrow column
          ctx.fillStyle = '#8a8a82';
          ctx.fillRect(wtx - 2, surfaceY - lh, 4, lh);
          ctx.fillStyle = wt.bodyColor;
          // wide saucer disc
          ctx.beginPath();
          ctx.ellipse(wtx, surfaceY - lh - tr * 0.3, tr * 1.6, tr * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          // dome on top
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr * 0.3, tr * 0.7, Math.PI, 0);
          ctx.fill();
          // small cap
          ctx.fillRect(wtx - 1, surfaceY - lh - tr * 0.3 - tr * 0.7 - 2, 2, 2);
        } else if (wt.type === 'smoothdome'){
          // smooth teardrop/dome on concealed tapered base
          const bw = 5 + tr * 0.3;
          ctx.fillStyle = '#9a9a90';
          ctx.beginPath();
          ctx.moveTo(wtx - bw, surfaceY);
          ctx.quadraticCurveTo(wtx - 1, surfaceY - lh * 0.5, wtx - 2, surfaceY - lh);
          ctx.lineTo(wtx + 2, surfaceY - lh);
          ctx.quadraticCurveTo(wtx + 1, surfaceY - lh * 0.5, wtx + bw, surfaceY);
          ctx.closePath();
          ctx.fill();
          // smooth dome tank
          ctx.fillStyle = wt.bodyColor;
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh, tr, 0, Math.PI * 2);
          ctx.fill();
          // smooth top dome
          ctx.beginPath();
          ctx.arc(wtx, surfaceY - lh - tr * 0.3, tr * 0.75, Math.PI, 0);
          ctx.fill();
        }
      }
    }
  }
}

/* ---------- industrial layers (dense low warehouses/factories, behind city) ---------- */
const industrialDefs = [];

function initIndustrial(){
  industrialDefs.length = 0;
  const configs = [
    { period: 2800, factor: 0.18, baseYFrac: 0.77, terrainIdx: 0, hScale: 5, count: 80, baseColor: [78,78,82], terrainColor: '#3e4444' },
    { period: 2400, factor: 0.20, baseYFrac: 0.79, terrainIdx: 1, hScale: 5, count: 70, baseColor: [74,74,78], terrainColor: '#3a4040' },
    { period: 2000, factor: 0.22, baseYFrac: 0.80, terrainIdx: 2, hScale: 6, count: 60, baseColor: [68,68,72], terrainColor: '#363c3c' },
    { period: 1700, factor: 0.24, baseYFrac: 0.82, terrainIdx: 3, hScale: 6, count: 55, baseColor: [62,62,68], terrainColor: '#323838' },
  ];
  for (const cfg of configs){
    const buildings = [];
    const spacing = cfg.period / cfg.count;
    for (let i = 0; i < cfg.count; i++){
      const x = i * spacing + Math.random() * spacing * 0.15;
      const w = 18 + Math.random() * 30;
      const h = 8 + Math.random() * 8;
      const hasStack = Math.random() < 0.25;
      const stackH = 6 + Math.random() * 12;
      const doors = [];
      const doorCount = 1 + Math.floor(Math.random() * 4);
      const doorW = 2 + Math.random() * 2;
      for (let di = 0; di < doorCount; di++){
        doors.push({ dx: (di + 1) * w / (doorCount + 1) - doorW / 2 });
      }
      const cr = cfg.baseColor[0] + Math.floor(Math.random() * 20 - 10);
      const cg = cfg.baseColor[1] + Math.floor(Math.random() * 20 - 10);
      const cb = cfg.baseColor[2] + Math.floor(Math.random() * 20 - 10);
      const bColor = `rgb(${cr},${cg},${cb})`;
      buildings.push({ x, w, h, hasStack, stackH, doors, doorW, special: null, bColor });
    }
    // scatter water towers and antenna towers
    const specialCount = 3 + Math.floor(Math.random() * 4);
    for (let si = 0; si < specialCount; si++){
      const sx = Math.random() * cfg.period;
      const sType = Math.random() < 0.7 ? 'water' : 'antenna';
      const legH = 4 + Math.random() * 4;
      const tankR = 2 + Math.random() * 2;
      const antH = 80 + Math.random() * 70;
      buildings.push({ x: sx, w: 0, h: 0, hasStack: false, stackH: 0, doors: [], doorW: 0,
        special: sType, legH, tankR, antH, bColor: '#4a4a4e' });
    }
    industrialDefs.push({ ...cfg, buildings });
  }
}
initIndustrial();

function drawIndustrial(){
  for (const layer of industrialDefs){
    const baseY = groundY * layer.baseYFrac;
    const prof = industrialTerrainProfiles[layer.terrainIdx];
    drawTerrainLayer(layer.terrainColor, prof, layer.period, layer.factor, baseY, layer.hScale);

    const off = ((scroll * layer.factor) % layer.period + layer.period) % layer.period;
    for (let rep = -off - layer.period; rep < W + layer.period; rep += layer.period){
      for (const b of layer.buildings){
        const bx = rep + b.x;
        if (bx + b.w < -5 || bx > W + 5) continue;
        const th = profileHeightAt(prof, b.x / layer.period) * layer.hScale;
        const surfaceY = baseY - th;
        ctx.fillStyle = b.bColor;
        ctx.fillRect(bx, surfaceY - b.h, b.w, b.h + 1);
        if (b.hasStack){
          ctx.fillRect(bx + b.w * 0.7, surfaceY - b.h - b.stackH, 3, b.stackH);
        }
        if (b.special === 'water'){
          // rooftop water tank — small barrel on short legs atop building level
          const roofY = surfaceY - 10;
          ctx.fillStyle = '#6a6a6a';
          // short legs
          ctx.fillRect(bx - 3, roofY - b.legH * 0.3, 1.5, b.legH * 0.3);
          ctx.fillRect(bx + 2, roofY - b.legH * 0.3, 1.5, b.legH * 0.3);
          // barrel tank
          ctx.fillStyle = '#7a7a72';
          const tw = b.tankR * 1.2, tth = b.tankR * 1.4;
          ctx.fillRect(bx - tw, roofY - b.legH * 0.3 - tth, tw * 2, tth);
          // conical roof
          ctx.fillStyle = '#5a5a55';
          ctx.beginPath();
          ctx.moveTo(bx - tw - 1, roofY - b.legH * 0.3 - tth);
          ctx.lineTo(bx, roofY - b.legH * 0.3 - tth - 4);
          ctx.lineTo(bx + tw + 1, roofY - b.legH * 0.3 - tth);
          ctx.closePath();
          ctx.fill();
          // barrel bands
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 0.5;
          for (let bi = 1; bi < 3; bi++){
            const by = roofY - b.legH * 0.3 - tth * bi / 3;
            ctx.beginPath();
            ctx.moveTo(bx - tw, by);
            ctx.lineTo(bx + tw, by);
            ctx.stroke();
          }
        } else if (b.special === 'antenna'){
          // antenna tower: lattice mast + guy wires
          ctx.fillStyle = '#5a5a5a';
          ctx.fillRect(bx, surfaceY - b.antH, 2, b.antH);
          // cross members
          ctx.strokeStyle = '#4a4a4a';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          for (let ay = 0; ay < b.antH; ay += 6){
            ctx.moveTo(bx - 2, surfaceY - ay);
            ctx.lineTo(bx + 4, surfaceY - ay - 3);
            ctx.moveTo(bx + 4, surfaceY - ay);
            ctx.lineTo(bx - 2, surfaceY - ay - 3);
          }
          ctx.stroke();
          // blinking light at top
          ctx.fillStyle = 'rgba(255,40,40,0.7)';
          ctx.beginPath();
          ctx.arc(bx + 1, surfaceY - b.antH, 1.5, 0, Math.PI * 2);
          ctx.fill();
          // guy wires
          ctx.strokeStyle = 'rgba(80,80,80,0.4)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(bx + 1, surfaceY - b.antH * 0.7);
          ctx.lineTo(bx - 12, surfaceY);
          ctx.moveTo(bx + 1, surfaceY - b.antH * 0.7);
          ctx.lineTo(bx + 14, surfaceY);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#2a2a30';
          for (const door of b.doors){
            ctx.fillRect(bx + door.dx, surfaceY - 3, b.doorW, 3);
          }
        }
      }
    }
  }
}

/* ---------- city layers (tall building silhouettes behind farms) ---------- */
const cityDefs = [];

function initCities(){
  cityDefs.length = 0;
  const configs = [
    { period: 4000, factor: 0.12, baseYFrac: 0.72, terrainIdx: 0, hScale: 8,  count: 140, minH: 8,  maxH: 40, minW: 6,  maxW: 18, bodyColor: [69,77,98], windowAlpha: 0.12 },
    { period: 3200, factor: 0.14, baseYFrac: 0.74, terrainIdx: 1, hScale: 10, count: 110, minH: 10, maxH: 55, minW: 8,  maxW: 22, bodyColor: [58,66,88], windowAlpha: 0.20 },
    { period: 2600, factor: 0.16, baseYFrac: 0.76, terrainIdx: 2, hScale: 12, count: 90,  minH: 12, maxH: 70, minW: 10, maxW: 26, bodyColor: [46,54,77], windowAlpha: 0.30 },
  ];
  for (const cfg of configs){
    const buildings = [];
    const spacing = cfg.period / cfg.count;
    // height envelope: fractal-like clustering with 2-3 downtown peaks
    const peaks = 2 + Math.floor(Math.random() * 2);
    const peakCenters = [];
    for (let p = 0; p < peaks; p++) peakCenters.push(Math.random());
    const peakWidths = peakCenters.map(() => 0.06 + Math.random() * 0.1);

    for (let i = 0; i < cfg.count; i++){
      const x = i * spacing + Math.random() * spacing * 0.5;
      const xFrac = x / cfg.period;
      // compute height envelope from peaks
      let envelope = 0.3;
      for (let p = 0; p < peaks; p++){
        const dist = Math.abs(xFrac - peakCenters[p]);
        const wrapped = Math.min(dist, 1 - dist);
        envelope = Math.max(envelope, Math.exp(-(wrapped * wrapped) / (2 * peakWidths[p] * peakWidths[p])));
      }
      const w = cfg.minW + Math.random() * (cfg.maxW - cfg.minW);
      let h = cfg.minH + (cfg.maxH - cfg.minH) * (0.2 + 0.8 * envelope) * (0.5 + Math.random() * 0.5);
      if (Math.random() < 0.1 * envelope) h = h * 2 + Math.random() * 40;
      const roofTypes = ['flat','flat','flat','pointed','antenna','stepped','dome'];
      const roof = roofTypes[Math.floor(Math.random() * roofTypes.length)];
      // per-building color tint
      const cr = cfg.bodyColor[0] + Math.floor(Math.random() * 16 - 8);
      const cg = cfg.bodyColor[1] + Math.floor(Math.random() * 16 - 8);
      const cb = cfg.bodyColor[2] + Math.floor(Math.random() * 16 - 8);
      const bColor = `rgb(${cr},${cg},${cb})`;
      const wSize = 0.8 + Math.random() * 0.8;
      const winDensity = 2 + Math.random() * 3;
      const windowCols = Math.max(1, Math.floor(w / winDensity));
      const windowRows = Math.max(1, Math.floor(h / (1.5 + Math.random() * 1.5)));
      const wGapX = w / (windowCols + 1);
      const wGapY = h / (windowRows + 1);
      const darkChance = 0.15 + Math.random() * 0.4;
      const wAlpha = cfg.windowAlpha * (0.6 + Math.random() * 0.8);
      const windowColor = `rgba(255,216,110,${wAlpha.toFixed(2)})`;
      const windows = [];
      for (let wy = 1; wy <= windowRows; wy++){
        for (let wx = 1; wx <= windowCols; wx++){
          if (Math.random() < darkChance) continue;
          windows.push({ dx: wx * wGapX - wSize / 2, dy: wy * wGapY - wSize / 2 });
        }
      }
      buildings.push({ x, w, h, roof, windows, wSize, bColor, windowColor });
    }
    cityDefs.push({ ...cfg, buildings });
  }
}
initCities();

function drawCities(){
  for (const layer of cityDefs){
    const baseY = groundY * layer.baseYFrac;
    const prof = cityTerrainProfiles[layer.terrainIdx];
    const terrainCol = `rgb(${layer.bodyColor[0]},${layer.bodyColor[1]},${layer.bodyColor[2]})`;
    drawTerrainLayer(terrainCol, prof, layer.period, layer.factor, baseY, layer.hScale);

    const off = ((scroll * layer.factor) % layer.period + layer.period) % layer.period;
    for (let rep = -off - layer.period; rep < W + layer.period; rep += layer.period){
      for (const b of layer.buildings){
        const bx = rep + b.x;
        if (bx + b.w < -5 || bx > W + 5) continue;
        const th = profileHeightAt(prof, b.x / layer.period) * layer.hScale;
        const surfaceY = baseY - th;

        ctx.fillStyle = b.bColor;
        ctx.fillRect(bx, surfaceY - b.h, b.w, b.h + 1);

        if (b.roof === 'pointed'){
          ctx.beginPath();
          ctx.moveTo(bx, surfaceY - b.h);
          ctx.lineTo(bx + b.w / 2, surfaceY - b.h - b.w * 0.35);
          ctx.lineTo(bx + b.w, surfaceY - b.h);
          ctx.closePath();
          ctx.fill();
        } else if (b.roof === 'antenna'){
          ctx.fillRect(bx + b.w / 2 - 1, surfaceY - b.h - 8, 2, 8);
          ctx.fillStyle = 'rgba(255,60,60,0.6)';
          ctx.beginPath();
          ctx.arc(bx + b.w / 2, surfaceY - b.h - 8, 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (b.roof === 'stepped'){
          ctx.fillRect(bx + b.w * 0.2, surfaceY - b.h - 5, b.w * 0.6, 5);
          ctx.fillRect(bx + b.w * 0.35, surfaceY - b.h - 9, b.w * 0.3, 4);
        } else if (b.roof === 'dome'){
          ctx.beginPath();
          ctx.arc(bx + b.w / 2, surfaceY - b.h, b.w * 0.35, Math.PI, 0);
          ctx.fill();
        }

        if (b.windows.length > 0){
          ctx.fillStyle = b.windowColor;
          for (const win of b.windows){
            ctx.fillRect(bx + win.dx, surfaceY - b.h + win.dy, b.wSize, b.wSize);
          }
        }
      }
    }
  }
}

/* ---------- terrain profile interpolation helper ---------- */
function profileHeightAt(profile, xFrac){
  const samples = profile.length - 1;
  const t = Math.max(0, Math.min(1, xFrac)) * samples;
  const i = Math.floor(t);
  const f = t - i;
  const h0 = Math.max(0, profile[Math.min(i, samples)]);
  const h1 = Math.max(0, profile[Math.min(i + 1, samples)]);
  return h0 + (h1 - h0) * f;
}

/* ---------- farm layers (rolling fields with barns, silos, fences) ---------- */
const farmDefs = [];

function initFarms(){
  farmDefs.length = 0;
  const configs = [
    { period: 1800, factor: 0.34, baseYFrac: 0.88, profileIdx: 0, heightScale: 10, terrainColor: '#6e7e3e' },
    { period: 1500, factor: 0.36, baseYFrac: 0.89, profileIdx: 1, heightScale: 11, terrainColor: '#6a7a3a' },
    { period: 1300, factor: 0.38, baseYFrac: 0.90, profileIdx: 2, heightScale: 12, terrainColor: '#5e7234' },
    { period: 1100, factor: 0.40, baseYFrac: 0.91, profileIdx: 3, heightScale: 10, terrainColor: '#5a7232' },
  ];
  for (const cfg of configs){
    // barns and silos
    const barnColors = ['#8a2222','#7a3020','#6a2828','#9a3018','#7e2018','#8a4028','#6e1a1a','#984030','#703228','#882a1a'];
    const barnRoofColors = ['#6a1818','#5a2418','#4a1e1e','#7a2414','#5e1814','#6a3020','#4e1212','#783020','#582420','#6a2016'];
    const structures = [];
    const structCount = 3 + Math.floor(Math.random() * 4);
    const structSpacing = cfg.period / (structCount + 1);
    for (let i = 0; i < structCount; i++){
      const x = (i + 1) * structSpacing + (Math.random() - 0.5) * structSpacing * 0.4;
      const type = Math.random() < 0.5 ? 'barn' : 'silo';
      const bci = Math.floor(Math.random() * barnColors.length);
      structures.push({
        x, type,
        barnW: 16 + Math.random() * 18,
        barnH: 10 + Math.random() * 14,
        barnColor: barnColors[bci],
        barnRoofColor: barnRoofColors[bci],
        siloW: 4 + Math.random() * 5,
        siloH: 14 + Math.random() * 16,

    // fence posts
    const posts = [];
    const postSpacing = 16 + Math.random() * 6;
    for (let x = 0; x < cfg.period; x += postSpacing){
      posts.push({ x: x + Math.random() * 3 });

    // farm features: crops, animals, equipment
    const features = [];
    const featureTypes = ['corn', 'soy', 'cows', 'horses', 'bales', 'irrigation'];
    const featureCount = Math.floor(cfg.period / 60) + Math.floor(Math.random() * 8);
    const fSpacing = cfg.period / featureCount;
    for (let i = 0; i < featureCount; i++){
      const x = i * fSpacing + Math.random() * fSpacing * 0.5 + 10;
      const type = featureTypes[Math.floor(Math.random() * featureTypes.length)];
      const feat = { x, type };

      if (type === 'corn'){
        feat.width = 25 + Math.random() * 30;
        feat.stalks = [];
        const cnt = 5 + Math.floor(Math.random() * 8);
        for (let si = 0; si < cnt; si++){
          feat.stalks.push({ dx: si * (feat.width / cnt) + Math.random() * 3, h: 4 + Math.random() * 3 });
        }
      } else if (type === 'soy'){
        feat.width = 25 + Math.random() * 35;
        feat.rows = 3 + Math.floor(Math.random() * 3);
        feat.rowH = 2 + Math.random() * 2;
      } else if (type === 'cows'){
        feat.animals = [];
        const cnt = 2 + Math.floor(Math.random() * 4);
        for (let ai = 0; ai < cnt; ai++){
          feat.animals.push({
            dx: ai * (8 + Math.random() * 6),
            color: Math.random() < 0.4 ? '#1a1a1a' : (Math.random() < 0.5 ? '#f0e8d8' : '#5a3a1a'),
            flip: Math.random() < 0.5,
          });
        }
      } else if (type === 'horses'){
        feat.animals = [];
        const cnt = 1 + Math.floor(Math.random() * 3);
        for (let ai = 0; ai < cnt; ai++){
          feat.animals.push({
            dx: ai * (10 + Math.random() * 8),
            color: ['#5a2a0a', '#8a5a2a', '#3a2a1a', '#c4a070'][Math.floor(Math.random() * 4)],
            flip: Math.random() < 0.5,
          });
        }
      } else if (type === 'bales'){
        feat.bales = [];
        const cnt = 2 + Math.floor(Math.random() * 4);
        for (let bi = 0; bi < cnt; bi++){
          feat.bales.push({ dx: bi * (8 + Math.random() * 5), r: 3 + Math.random() * 3 });

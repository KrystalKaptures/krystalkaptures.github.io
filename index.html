        feat.armLen = 40 + Math.random() * 50;
        feat.angle = (Math.random() - 0.5) * 0.3;
        feat.towers = Math.floor(feat.armLen / 15);
      }
      features.push(feat);
    }
    farmDefs.push({ ...cfg, structures, posts, features });
  }
}
initFarms();

function drawFarms(){
  for (const layer of farmDefs){
    const baseY = groundY * layer.baseYFrac;
    const prof = farmProfiles[layer.profileIdx];
    drawTerrainLayer(layer.terrainColor, prof, layer.period, layer.factor, baseY, layer.heightScale);

    const off = ((scroll * layer.factor) % layer.period + layer.period) % layer.period;
    for (let rep = -off - layer.period; rep < W + layer.period; rep += layer.period){
      // fence posts (terrain-following)
      ctx.fillStyle = '#5a4a30';
      for (const post of layer.posts){
        const px = rep + post.x;
        if (px < -3 || px > W + 3) continue;
        const th = profileHeightAt(prof, post.x / layer.period) * layer.heightScale;
        const surfaceY = baseY - th;
        ctx.fillRect(px, surfaceY - 3, 1.5, 3);
      }
      // fence rails between posts
      ctx.strokeStyle = '#5a4a30';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let pi = 0; pi < layer.posts.length - 1; pi++){
        const p0 = layer.posts[pi], p1 = layer.posts[pi + 1];
        const px0 = rep + p0.x, px1 = rep + p1.x;
        if (px1 < -5 || px0 > W + 5) continue;
        const h0 = profileHeightAt(prof, p0.x / layer.period) * layer.heightScale;
        const h1 = profileHeightAt(prof, p1.x / layer.period) * layer.heightScale;
        const sy0 = baseY - h0, sy1 = baseY - h1;
        ctx.moveTo(px0, sy0 - 2.5);
        ctx.lineTo(px1, sy1 - 2.5);
        ctx.moveTo(px0, sy0 - 1);
        ctx.lineTo(px1, sy1 - 1);
      }
      ctx.stroke();

      // farm features (crops, animals, equipment)
      for (const feat of layer.features){
        const fx = rep + feat.x;
        if (fx < -100 || fx > W + 100) continue;
        const th = profileHeightAt(prof, feat.x / layer.period) * layer.heightScale;
        const surfaceY = baseY - th;

        if (feat.type === 'corn'){
          for (const stalk of feat.stalks){
            const sx = fx + stalk.dx;
            ctx.fillStyle = '#6a8a28';
            ctx.fillRect(sx, surfaceY - stalk.h, 1, stalk.h);
            ctx.fillStyle = '#5a7a20';
            ctx.fillRect(sx - 1, surfaceY - stalk.h * 0.6, 2, 1);
            ctx.fillStyle = '#c8a830';
            ctx.fillRect(sx + 0.5, surfaceY - stalk.h * 0.75, 1.5, 1.5);
          }
        } else if (feat.type === 'soy'){
          ctx.fillStyle = '#3a6a28';
          for (let ri = 0; ri < feat.rows; ri++){
            ctx.fillRect(fx, surfaceY - feat.rowH - ri * 5, feat.width, feat.rowH);
          }
        } else if (feat.type === 'cows'){
          for (const a of feat.animals){
            const ax = fx + a.dx;
            ctx.fillStyle = a.color;
            ctx.fillRect(ax, surfaceY - 5, 7, 4);
            ctx.fillRect(ax + (a.flip ? -2 : 7), surfaceY - 6, 2, 3);
            ctx.fillRect(ax + 1, surfaceY - 1, 1, 2);
            ctx.fillRect(ax + 5, surfaceY - 1, 1, 2);
          }
        } else if (feat.type === 'horses'){
          for (const a of feat.animals){
            const ax = fx + a.dx;
            ctx.fillStyle = a.color;
            ctx.fillRect(ax, surfaceY - 6, 8, 4);
            if (a.flip){
              ctx.fillRect(ax - 1, surfaceY - 9, 2, 4);
              ctx.fillRect(ax - 3, surfaceY - 9, 3, 2);
            } else {
              ctx.fillRect(ax + 7, surfaceY - 9, 2, 4);
              ctx.fillRect(ax + 8, surfaceY - 9, 3, 2);
            }
            ctx.fillRect(ax + 1, surfaceY - 2, 1, 3);
            ctx.fillRect(ax + 6, surfaceY - 2, 1, 3);
            ctx.fillRect(ax + (a.flip ? 8 : -1), surfaceY - 7, 1, 3);
          }
        } else if (feat.type === 'bales'){
          for (const b of feat.bales){
            const bx = fx + b.dx;
            ctx.fillStyle = '#c4a44a';
            ctx.beginPath();
            ctx.arc(bx, surfaceY - b.r, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#d4b85a';
            ctx.beginPath();
            ctx.arc(bx - b.r * 0.2, surfaceY - b.r - b.r * 0.2, b.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (feat.type === 'irrigation'){
          ctx.fillStyle = '#6a6a6a';
          ctx.beginPath();
          ctx.arc(fx, surfaceY - 3, 2, 0, Math.PI * 2);
          ctx.fill();
          const endX = fx + Math.cos(feat.angle) * feat.armLen;
          const endY = surfaceY - 3 + Math.sin(feat.angle) * feat.armLen * 0.3;
          ctx.strokeStyle = '#5a5a5a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(fx, surfaceY - 3);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.fillStyle = '#4a4a4a';
          for (let ti = 1; ti <= feat.towers; ti++){
            const t = ti / (feat.towers + 1);
            const tx = fx + (endX - fx) * t;
            const ty = surfaceY - 3 + (endY - (surfaceY - 3)) * t;
            ctx.fillRect(tx - 1, ty, 2, 4);
            ctx.beginPath();
            ctx.arc(tx, ty + 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // barns and silos
      for (const s of layer.structures){
        const sx = rep + s.x;
        if (sx < -40 || sx > W + 40) continue;
        const th = profileHeightAt(prof, s.x / layer.period) * layer.heightScale;
        const surfaceY = baseY - th;

        if (s.type === 'barn'){
          ctx.fillStyle = s.barnColor;
          ctx.fillRect(sx - s.barnW / 2, surfaceY - s.barnH, s.barnW, s.barnH);
          ctx.fillStyle = s.barnRoofColor;
          ctx.beginPath();
          ctx.moveTo(sx - s.barnW / 2 - 2, surfaceY - s.barnH);
          ctx.lineTo(sx, surfaceY - s.barnH - s.barnH * 0.45);
          ctx.lineTo(sx + s.barnW / 2 + 2, surfaceY - s.barnH);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#4a1010';
          ctx.fillRect(sx - 3, surfaceY - 7, 6, 7);
        } else {
          ctx.fillStyle = '#8a8a7a';
          ctx.fillRect(sx - s.siloW / 2, surfaceY - s.siloH, s.siloW, s.siloH);
          ctx.fillStyle = '#7a7a6a';
          ctx.beginPath();
          ctx.arc(sx, surfaceY - s.siloH, s.siloW / 2, Math.PI, 0);
          ctx.fill();
        }
      }
    }
  }
}

/* ---------- background trees (distant fractal silhouettes on the near hill) ---------- */
const BG_TREE_PERIOD = 8000;
const bgTrees = [];

function generateBgTree(rng){
  const trunk = [];
  const canopyPts = [];

  function branch(sx, sy, ang, len, w, depth){
    if (depth > 3 || len < 3) return;
    const ex = sx + Math.cos(ang) * len;
    let ey = sy + Math.sin(ang) * len;
    if (ey > -2) ey = -2;

    // mid-segment branch chance
    const midFork = rng() < 0.4 && depth < 3;
    if (midFork){
      const mt = 0.3 + rng() * 0.4;
      const mx = sx + (ex - sx) * mt;
      const my = sy + (ey - sy) * mt;
      trunk.push({ x1: sx, y1: sy, x2: mx, y2: my, w });
      trunk.push({ x1: mx, y1: my, x2: ex, y2: ey, w: w * 0.85 });
      let ma = ang + (rng() < 0.5 ? -1 : 1) * (0.4 + rng() * 0.5);
      if (ma > -0.2) ma = -0.2;
      branch(mx, my, ma, len * (0.35 + rng() * 0.15), Math.max(0.5, w * 0.5), depth + 1);
    } else {
      trunk.push({ x1: sx, y1: sy, x2: ex, y2: ey, w });
    }

    // sample canopy boundary at branch tips
    if (depth >= 1){
      const r = 3 + len * 0.3;
      for (let a = 0; a < 6; a++){
        const ba = a * Math.PI / 3;
        canopyPts.push({ x: ex + Math.cos(ba) * r, y: ey + Math.sin(ba) * r });
      }
    }
    const kids = depth === 0 ? 2 + Math.floor(rng() * 2) : 1 + Math.floor(rng() * 2);
    for (let i = 0; i < kids; i++){
      let ca = ang + (rng() - 0.5) * 1.2;
      if (ca > -0.2) ca = -0.2;
      branch(ex, ey, ca, len * (0.5 + rng() * 0.2), Math.max(0.5, w * 0.55), depth + 1);
    }
  }

  const h = 25 + rng() * 30;
  const lean = (rng() - 0.5) * 0.2;
  branch(0, 0, -Math.PI / 2 + lean, h, 3 + rng() * 2, 0);

  // compute hull for canopy
  let hull = [];
  if (canopyPts.length >= 3){
    hull = convexHull(canopyPts);
  }
  return { trunk, hull };
}

function initBgTrees(){
  bgTrees.length = 0;
  for (let i = 0; i < 50; i++){
    const rng = () => Math.random();
    const x = i * (BG_TREE_PERIOD / 50) + rng() * 80;
    bgTrees.push({ x, ...generateBgTree(rng) });
  }
}
initBgTrees();

function drawBgTrees(){
  const factor = 0.42;
  const baseY = groundY * 0.92;
  const off = ((scroll * factor) % BG_TREE_PERIOD + BG_TREE_PERIOD) % BG_TREE_PERIOD;

  for (let rep = -off - BG_TREE_PERIOD; rep < W + BG_TREE_PERIOD; rep += BG_TREE_PERIOD){
    for (const bt of bgTrees){
      const tx = rep + bt.x;
      if (tx < -60 || tx > W + 60) continue;

      // trunk segments
      ctx.fillStyle = '#1e3018';
      for (const b of bt.trunk){
        const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const px = -dy / len * b.w / 2, py = dx / len * b.w / 2;
        ctx.beginPath();
        ctx.moveTo(tx + b.x1 + px, baseY + b.y1 + py);
        ctx.lineTo(tx + b.x2 + px * 0.6, baseY + b.y2 + py * 0.6);
        ctx.lineTo(tx + b.x2 - px * 0.6, baseY + b.y2 - py * 0.6);
        ctx.lineTo(tx + b.x1 - px, baseY + b.y1 - py);
        ctx.fill();
      }

      // canopy hull
      if (bt.hull.length >= 3){
        ctx.fillStyle = '#1a3a1c';
        ctx.beginPath();
        const h = bt.hull;
        ctx.moveTo(tx + (h[h.length-1].x + h[0].x) / 2, baseY + (h[h.length-1].y + h[0].y) / 2);
        for (let hi = 0; hi < h.length; hi++){
          const curr = h[hi], next = h[(hi + 1) % h.length];
          ctx.quadraticCurveTo(tx + curr.x, baseY + curr.y, tx + (curr.x + next.x) / 2, baseY + (curr.y + next.y) / 2);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

/* ---------- mid-layer trees (between bg trees and foreground, scaled smaller) ---------- */
const MID_TREE_PERIOD = 6000;
const midTrees = [];

function initMidTrees(){
  midTrees.length = 0;
  for (let i = 0; i < 35; i++){
    const rng = () => Math.random();
    const x = i * (MID_TREE_PERIOD / 35) + rng() * 80;
    const tree = generateBgTree(rng);
    // scale everything by 1.5x (bigger than bg but smaller than foreground)
    const scale = 1.3 + rng() * 0.4;
    tree.trunk.forEach(b => { b.x1 *= scale; b.y1 *= scale; b.x2 *= scale; b.y2 *= scale; b.w *= scale; });
    tree.hull = tree.hull.map(p => ({ x: p.x * scale, y: p.y * scale }));
    midTrees.push({ x, ...tree });
  }
}
initMidTrees();

function drawMidTrees(){
  const factor = 0.55;
  const baseY = groundY * 0.95;
  const off = ((scroll * factor) % MID_TREE_PERIOD + MID_TREE_PERIOD) % MID_TREE_PERIOD;

  for (let rep = -off - MID_TREE_PERIOD; rep < W + MID_TREE_PERIOD; rep += MID_TREE_PERIOD){
    for (const bt of midTrees){
      const tx = rep + bt.x;
      if (tx < -80 || tx > W + 80) continue;

      ctx.fillStyle = '#223a1a';
      for (const b of bt.trunk){
        const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const px = -dy / len * b.w / 2, py = dx / len * b.w / 2;
        ctx.beginPath();
        ctx.moveTo(tx + b.x1 + px, baseY + b.y1 + py);
        ctx.lineTo(tx + b.x2 + px * 0.6, baseY + b.y2 + py * 0.6);
        ctx.lineTo(tx + b.x2 - px * 0.6, baseY + b.y2 - py * 0.6);
        ctx.lineTo(tx + b.x1 - px, baseY + b.y1 - py);
        ctx.fill();
      }

      if (bt.hull.length >= 3){
        ctx.fillStyle = '#1e4520';
        ctx.beginPath();
        const h = bt.hull;
        ctx.moveTo(tx + (h[h.length-1].x + h[0].x) / 2, baseY + (h[h.length-1].y + h[0].y) / 2);
        for (let hi = 0; hi < h.length; hi++){
          const curr = h[hi], next = h[(hi + 1) % h.length];
          ctx.quadraticCurveTo(tx + curr.x, baseY + curr.y, tx + (curr.x + next.x) / 2, baseY + (curr.y + next.y) / 2);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

/* ---------- fractal tree generation (foreground) ---------- */

const TREE_PERIOD = 12000;
const TREE_COUNT  = 40;

/* Tree skeleton. `widthBias` (0-1) controls shape: 0 = tall/narrow, 1 = wide/spreading.
   Wide trees fork low with branches angled far out; narrow trees fork high and upward. */
function generateTreeBranches(rng, startX, startY, angle, length, width, depth, maxDepth, wood, frondRoots, widthBias){
  if (depth > maxDepth || length < 4) return;

  let endX = startX + Math.cos(angle) * length;
  let endY = startY + Math.sin(angle) * length;
  // clamp: don't grow below ground (y=0 is ground in tree-local coords)
  if (endY > -4){ endY = -4; endX = startX + (endX - startX) * Math.abs((-4 - startY) / (endY - startY + 0.01)); }

  // mid-segment branches: random chance to fork partway along this segment
  const midBranchChance = depth === 0 ? 0.6 : 0.35;
  const midCount = rng() < midBranchChance ? (1 + Math.floor(rng() * 2)) : 0;
  const midPoints = [];
  for (let mi = 0; mi < midCount; mi++){
    const t = 0.25 + rng() * 0.5;  // fork between 25%-75% along segment
    const mx = startX + (endX - startX) * t;
    const my = startY + (endY - startY) * t;
    midPoints.push({ x: mx, y: my, t });
  }

  // taper: width at start vs end of this segment
  const endWidth = width * 0.65;
  const color = '#4a2e12';

  if (midCount > 0){
    const allPts = [{ x: startX, y: startY, t: 0 }, ...midPoints, { x: endX, y: endY, t: 1 }];
    allPts.sort((a, b) => a.t - b.t);
    for (let si = 0; si < allPts.length - 1; si++){
      const p0 = allPts[si], p1 = allPts[si + 1];
      const w1 = width + (endWidth - width) * p0.t;
      const w2 = width + (endWidth - width) * p1.t;
      const bk = []; for (let bi = 0; bi < 5; bi++) bk.push((rng()-0.5)*w1*0.15, (rng()-0.5)*w1*0.12);
      // bark grain: thin lines along trunk + knot marks
      const grain = [];
      const grainCount = Math.max(1, Math.floor(w1 / 3));
      for (let gi = 0; gi < grainCount; gi++) grain.push((rng()-0.5)*0.7, rng()*0.15+0.05);
      const knots = [];
      if (rng() < 0.3){ knots.push({ t: 0.2+rng()*0.6, off: (rng()-0.5)*0.5, r: 1+rng()*2 }); }
      wood.push({ x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, w1, w2, color, bark: bk, grain, knots });
    }
  } else {
    const bk = []; for (let bi = 0; bi < 5; bi++) bk.push((rng()-0.5)*width*0.15, (rng()-0.5)*width*0.12);
    const grain = [];
    const grainCount = Math.max(2, Math.floor(width / 3));
    for (let gi = 0; gi < grainCount; gi++) grain.push((rng()-0.5)*0.7, rng()*0.15+0.05);
    const knots = [];
    if (rng() < 0.4){ knots.push({ t: 0.2+rng()*0.6, off: (rng()-0.5)*0.5, r: 1.5+rng()*2.5 }); }
    if (rng() < 0.15){ knots.push({ t: 0.1+rng()*0.8, off: (rng()-0.5)*0.5, r: 1+rng()*2 }); }
    wood.push({ x1: startX, y1: startY, x2: endX, y2: endY, w1: width, w2: endWidth, color, bark: bk, grain, knots });
  }

  // spawn mid-segment child branches — width at fork point
  for (const mp of midPoints){
    const midSpread = (0.4 + widthBias * 0.4);
    const sp = (rng() < 0.5 ? -1 : 1) * (0.3 + rng() * midSpread) * Math.PI * 0.5;
    let midAngle = angle + sp;
    // bias upward: if pointing down, pull back toward horizontal
    if (midAngle > -0.15) midAngle = -0.15 + (midAngle + 0.15) * 0.2;
    const midLen = length * (0.35 + rng() * 0.2) * (1 - mp.t * 0.3);
    const forkW = width + (endWidth - width) * mp.t;
    const midW = Math.max(1.5, forkW * (0.5 + rng() * 0.2));
    generateTreeBranches(rng, mp.x, mp.y, midAngle, midLen, midW, depth + 1, maxDepth, wood, frondRoots, widthBias);
  }

  // large fronds at major branch endpoints only (depth 1-2)
  if (depth >= 1 && depth <= 2){
    const fSize = 60 + length * 0.5 + rng() * 40;
    const fAngle = angle + (rng() - 0.5) * 1.2;
    const g = Math.floor(70 + rng() * 105);
    frondRoots.push({ cx: endX, cy: endY, size: fSize, angle: fAngle, g, seed: Math.floor(rng() * 100000) });
  }

  // end-of-segment child branches
  const numChildren = depth === 0
    ? (3 + Math.floor(rng() * 2) + (widthBias > 0.6 ? 1 : 0))
    : (1 + Math.floor(rng() * 3));
  const spreadAng = depth === 0
    ? (0.3 + widthBias * 0.6)
    : (0.4 + widthBias * 0.35);
  for (let i = 0; i < numChildren; i++){
    const sp = (rng() - 0.5) * spreadAng * Math.PI;
    let childAngle = angle + sp;
    // bias upward: dampen any downward tendency
    if (childAngle > -0.15) childAngle = -0.15 + (childAngle + 0.15) * 0.2;
    const shrink = 0.45 + rng() * 0.2 + widthBias * 0.08;
    const childLen = length * shrink;
    const childW = Math.max(1.5, endWidth * (0.55 + rng() * 0.25));
    generateTreeBranches(rng, endX, endY, childAngle, childLen, childW, depth + 1, maxDepth, wood, frondRoots, widthBias);
  }
}

/* Convex hull (Andrew's monotone chain) */
function convexHull(points){
  const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (pts.length <= 2) return pts;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const p of pts){ while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop(); upper.push(p); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/* Frond: scatter points to define a canopy blob, compute the convex hull,
   store as a single polygon. One fill() per frond at draw time. */
function generateFrond(seed, size, angle, g){
  const rng = () => Math.random();
  // scatter sample points to form one large canopy mass
  const raw = [];
  const count = 6 + Math.floor(rng() * 4);
  for (let i = 0; i < count; i++){
    const t = (i + 0.3) / count;
    const cx = Math.cos(angle) * size * 0.4 * t + (rng() - 0.5) * size * 0.7;
    const cy = Math.sin(angle) * size * 0.4 * t + (rng() - 0.5) * size * 0.7;
    const r = size * (0.35 + rng() * 0.25);
    for (let a = 0; a < 8; a++){
      const ang = a * Math.PI * 0.25;
      raw.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r });
    }
  }
  const hull = convexHull(raw);
  const cenX = hull.reduce((s, p) => s + p.x, 0) / hull.length;
  const cenY = hull.reduce((s, p) => s + p.y, 0) / hull.length;
  const innerHull = hull.map(p => ({
    x: cenX + (p.x - cenX) * 0.5,
    y: cenY + (p.y - cenY) * 0.5 - size * 0.06,
  }));
  // leaf clusters: small circles placed along hull edge, pushed outward
  const baseR = size * 0.12;
  const leafCircles = [];
  for (let i = 0; i < hull.length; i++){
    const curr = hull[i];
    const next = hull[(i + 1) % hull.length];
    const dx = next.x - curr.x, dy = next.y - curr.y;
    const segLen = Math.sqrt(dx * dx + dy * dy);
    const cnt = Math.max(2, Math.round(segLen / (baseR * 0.7)));
    for (let n = 0; n < cnt; n++){
      const t = (n + rng() * 0.5) / cnt;
      const px = curr.x + dx * t, py = curr.y + dy * t;
      const ex = px - cenX, ey = py - cenY;
      const ed = Math.sqrt(ex * ex + ey * ey) || 1;
      const len = baseR * (0.8 + rng() * 1.2);
      const wid = len * (0.25 + rng() * 0.2);
      const rot = Math.atan2(ey, ex) + (rng() - 0.5) * 1.2;
      leafCircles.push({ x: px, y: py, len, wid, rot });
    }
  }
  // gap cutouts: leaf shapes between edge leaves, pointing inward
  const gapLeaves = [];
  for (let i = 0; i < hull.length; i++){
    const curr = hull[i];
    const next = hull[(i + 1) % hull.length];
    const dx = next.x - curr.x, dy = next.y - curr.y;
    const segLen = Math.sqrt(dx * dx + dy * dy);
    const gCnt = Math.max(1, Math.round(segLen / (baseR * 0.9)));
    for (let n = 0; n < gCnt; n++){
      const t = (n + 0.3 + rng() * 0.4) / gCnt;
      const px = curr.x + dx * t, py = curr.y + dy * t;
      const ex = px - cenX, ey = py - cenY;
      const gLen = baseR * (0.6 + rng() * 0.8);
      const gWid = gLen * (0.2 + rng() * 0.15);
      const gRot = Math.atan2(ey, ex) + Math.PI + (rng() - 0.5) * 0.8;
      gapLeaves.push({ x: px, y: py, len: gLen, wid: gWid, rot: gRot });
    }
  }
  // inner hull edge leaves
  const innerBaseR = baseR * 0.5;
  const innerLeaves = [];
  const iCenX = innerHull.reduce((s, p) => s + p.x, 0) / innerHull.length;
  const iCenY = innerHull.reduce((s, p) => s + p.y, 0) / innerHull.length;
  for (let i = 0; i < innerHull.length; i++){
    const curr = innerHull[i];
    const next = innerHull[(i + 1) % innerHull.length];
    const dx = next.x - curr.x, dy = next.y - curr.y;
    const segLen = Math.sqrt(dx * dx + dy * dy);
    const cnt = Math.max(1, Math.round(segLen / (innerBaseR * 0.8)));
    for (let n = 0; n < cnt; n++){
      const t = (n + rng() * 0.5) / cnt;
      const px = curr.x + dx * t, py = curr.y + dy * t;
      const ex = px - iCenX, ey = py - iCenY;
      const len = innerBaseR * (0.7 + rng() * 1.0);
      const wid = len * (0.25 + rng() * 0.2);
      const rot = Math.atan2(ey, ex) + (rng() - 0.5) * 1.2;
      innerLeaves.push({ x: px, y: py, len, wid, rot });
    }
  }
  // inner gap cutouts
  const innerGapLeaves = [];
  for (let i = 0; i < innerHull.length; i++){
    const curr = innerHull[i];
    const next = innerHull[(i + 1) % innerHull.length];
    const dx = next.x - curr.x, dy = next.y - curr.y;
    const segLen = Math.sqrt(dx * dx + dy * dy);
    const gCnt = Math.max(1, Math.round(segLen / (innerBaseR * 1.0)));
    for (let n = 0; n < gCnt; n++){
      const t = (n + 0.3 + rng() * 0.4) / gCnt;
      const px = curr.x + dx * t, py = curr.y + dy * t;
      const ex = px - iCenX, ey = py - iCenY;
      const gLen = innerBaseR * (0.5 + rng() * 0.7);
      const gWid = gLen * (0.2 + rng() * 0.15);
      const gRot = Math.atan2(ey, ex) + Math.PI + (rng() - 0.5) * 0.8;
      innerGapLeaves.push({ x: px, y: py, len: gLen, wid: gWid, rot: gRot });
    }
  }
  return { hull, innerHull, g, leafCircles, gapLeaves, innerLeaves, innerGapLeaves, cenX, cenY };
}

const treeDefs = [];
function initTrees(){
  treeDefs.length = 0;
  const r = Math.random;
  for (let i = 0; i < TREE_COUNT; i++){
    const rng = () => Math.random();
    const x = i * (TREE_PERIOD / TREE_COUNT) + 200 + rng() * 400;
    const widthBias = rng();  // 0 = tall/narrow, 1 = wide/spreading
    const trunkLen = 500 + rng() * 300 + (1 - widthBias) * 150;
    const trunkW = 42 + rng() * 30 + widthBias * 18;
    const maxDepth = 5 + Math.floor(rng() * 2);
    const wood = [], frondRoots = [];
    const lean = (rng() - 0.5) * 0.15;
    generateTreeBranches(rng, 0, 0, -Math.PI / 2 + lean, trunkLen, trunkW, 0, maxDepth, wood, frondRoots, widthBias);

    const fronds = frondRoots.map(fr =>
      ({ cx: fr.cx, cy: fr.cy, frond: generateFrond(fr.seed, fr.size, fr.angle, fr.g) })
    );
    // sort: high cy (near ground/back) first, low cy (up top/front) last
    fronds.sort((a, b) => b.cy - a.cy);
    // compute absolute y-range across entire tree for depth mapping
    let minCy = Infinity, maxCy = -Infinity;
    for (const fr of fronds){ if (fr.cy < minCy) minCy = fr.cy; if (fr.cy > maxCy) maxCy = fr.cy; }

    treeDefs.push({ x, wood, fronds, minCy, maxCy });
  }
}
initTrees();

/* ---------- mid-foreground tree (full fractal tree, scaled down, rare) ---------- */
const MFG_TREE_PERIOD = 3200;
const mfgTreeDefs = [];
function initMfgTrees(){
  mfgTreeDefs.length = 0;
  const rng = () => Math.random();
  const x = 400 + rng() * (MFG_TREE_PERIOD - 800);
  const widthBias = rng();
  const scale = 0.55 + rng() * 0.15;
  const trunkLen = (400 + rng() * 200) * scale;
  const trunkW = (35 + rng() * 20 + widthBias * 12) * scale;
  const maxDepth = 4 + Math.floor(rng() * 2);
  const wood = [], frondRoots = [];
  const lean = (rng() - 0.5) * 0.15;
  generateTreeBranches(rng, 0, 0, -Math.PI / 2 + lean, trunkLen, trunkW, 0, maxDepth, wood, frondRoots, widthBias);
  const fronds = frondRoots.map(fr =>
    ({ cx: fr.cx, cy: fr.cy, frond: generateFrond(fr.seed, fr.size * scale, fr.angle, fr.g) })
  );
  mfgTreeDefs.push({ x, wood, fronds });
}
initMfgTrees();

function drawMfgTrees(){
  const factor = 0.65;
  const off = ((scroll * factor) % MFG_TREE_PERIOD + MFG_TREE_PERIOD) % MFG_TREE_PERIOD;
  const baseY = groundY * 0.97;

  for (let rep = -off - MFG_TREE_PERIOD; rep < W + MFG_TREE_PERIOD; rep += MFG_TREE_PERIOD){
    for (const t of mfgTreeDefs){
      const tx = rep + t.x;
      if (tx < -250 || tx > W + 250) continue;

      for (const b of t.wood){
        const sy1 = baseY + b.y1, sy2 = baseY + b.y2;
        if (sy1 < -50 && sy2 < -50) continue;
        if (sy1 > H + 50 && sy2 > H + 50) continue;
        const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const px = -dy / len, py = dx / len;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.moveTo(tx + b.x1 + px * b.w1/2, sy1 + py * b.w1/2);
        ctx.lineTo(tx + b.x2 + px * b.w2/2, sy2 + py * b.w2/2);
        ctx.lineTo(tx + b.x2 - px * b.w2/2, sy2 - py * b.w2/2);
        ctx.lineTo(tx + b.x1 - px * b.w1/2, sy1 - py * b.w1/2);
        ctx.closePath();
        ctx.fill();
      }

      for (const fr of t.fronds){
        const ox = tx + fr.cx, oy = baseY + fr.cy;
        if (oy < -150 || oy > H + 80 || ox < -150 || ox > W + 150) continue;
        const f = fr.frond, g = f.g, hull = f.hull;
        if (hull.length < 3) continue;
        const mr = Math.round(18 + g * 0.1), mgv = g, mb = Math.round(18 + g * 0.08);
        ctx.fillStyle = `rgb(${mr},${mgv},${mb})`;
        ctx.beginPath();
        ctx.moveTo(ox + (hull[hull.length-1].x + hull[0].x)/2, oy + (hull[hull.length-1].y + hull[0].y)/2);
        for (let hi = 0; hi < hull.length; hi++){
          const c = hull[hi], n = hull[(hi+1)%hull.length];
          ctx.quadraticCurveTo(ox + c.x, oy + c.y, ox + (c.x+n.x)/2, oy + (c.y+n.y)/2);
        }
        ctx.closePath();
        ctx.fill();
        if (f.gapLeaves){
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(ox + (hull[hull.length-1].x + hull[0].x)/2, oy + (hull[hull.length-1].y + hull[0].y)/2);
          for (let hi = 0; hi < hull.length; hi++){
            const c = hull[hi], n = hull[(hi+1)%hull.length];
            ctx.quadraticCurveTo(ox + c.x, oy + c.y, ox + (c.x+n.x)/2, oy + (c.y+n.y)/2);
          }
          ctx.clip();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.beginPath();
          for (const gc of f.gapLeaves){
            const lx = ox + gc.x, ly = oy + gc.y;
            const cr2 = Math.cos(gc.rot), sr2 = Math.sin(gc.rot);
            const hl = gc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + gc.wid * sr2, ly - gc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - gc.wid * sr2, ly + gc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
          ctx.restore();
        }
        if (f.leafCircles){
          ctx.fillStyle = `rgb(${mr},${mgv},${mb})`;
          ctx.beginPath();
          for (const lc of f.leafCircles){
            const lx = ox + lc.x, ly = oy + lc.y;
            const cr2 = Math.cos(lc.rot), sr2 = Math.sin(lc.rot);
            const hl = lc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + lc.wid * sr2, ly - lc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - lc.wid * sr2, ly + lc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
        }
        // inner highlight + cutouts + leaves
        const ih = f.innerHull;
        if (ih && ih.length >= 3){
          const igv = Math.min(255, g + 20);
          ctx.fillStyle = `rgb(${Math.round(28 + g * 0.12)},${igv},${Math.round(28 + g * 0.08)})`;
          ctx.beginPath();
          ctx.moveTo(ox + (ih[ih.length-1].x + ih[0].x)/2, oy + (ih[ih.length-1].y + ih[0].y)/2);
          for (let hi = 0; hi < ih.length; hi++){
            const c = ih[hi], n = ih[(hi+1)%ih.length];
            ctx.quadraticCurveTo(ox + c.x, oy + c.y, ox + (c.x+n.x)/2, oy + (c.y+n.y)/2);
          }
          ctx.closePath();
          ctx.fill();
          if (f.innerGapLeaves){
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(ox + (ih[ih.length-1].x + ih[0].x)/2, oy + (ih[ih.length-1].y + ih[0].y)/2);
            for (let hi = 0; hi < ih.length; hi++){
              const c = ih[hi], n = ih[(hi+1)%ih.length];
              ctx.quadraticCurveTo(ox + c.x, oy + c.y, ox + (c.x+n.x)/2, oy + (c.y+n.y)/2);
            }
            ctx.clip();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0,0,0,1)';
            ctx.beginPath();
            for (const gc of f.innerGapLeaves){
              const lx = ox + gc.x, ly = oy + gc.y;
              const cr2 = Math.cos(gc.rot), sr2 = Math.sin(gc.rot);
              const hl = gc.len / 2;
              ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
              ctx.quadraticCurveTo(lx + gc.wid * sr2, ly - gc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
              ctx.quadraticCurveTo(lx - gc.wid * sr2, ly + gc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
            }
            ctx.fill();
            ctx.restore();
          }
          if (f.innerLeaves){
            ctx.fillStyle = `rgb(${Math.round(28 + g * 0.12)},${igv},${Math.round(28 + g * 0.08)})`;
            ctx.beginPath();
            for (const lc of f.innerLeaves){
              const lx = ox + lc.x, ly = oy + lc.y;
              const cr2 = Math.cos(lc.rot), sr2 = Math.sin(lc.rot);
              const hl = lc.len / 2;
              ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
              ctx.quadraticCurveTo(lx + lc.wid * sr2, ly - lc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
              ctx.quadraticCurveTo(lx - lc.wid * sr2, ly + lc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
            }
            ctx.fill();
          }
        }
      }
    }
  }
}

function drawTrees(){
  const off = ((scroll * 0.85) % TREE_PERIOD + TREE_PERIOD) % TREE_PERIOD;
  const baseY = groundY + 2;

  for (let rep = -off - TREE_PERIOD; rep < W + TREE_PERIOD; rep += TREE_PERIOD){
    for (const t of treeDefs){
      const tx = rep + t.x;
      if (tx < -350 || tx > W + 350) continue;

      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.ellipse(tx, baseY + 3, 30, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // wood — tapered segments, skip if fully off screen
      for (const b of t.wood){
        const sy1 = baseY + b.y1, sy2 = baseY + b.y2;
        if (sy1 < -50 && sy2 < -50) continue;           // above viewport
        if (sy1 > H + 50 && sy2 > H + 50) continue;     // below viewport
        const sx1 = tx + b.x1, sx2 = tx + b.x2;
        if (sx1 < -80 && sx2 < -80) continue;
        if (sx1 > W + 80 && sx2 > W + 80) continue;
        const dx = b.x2 - b.x1;
        const dy = b.y2 - b.y1;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const px = -dy / len;
        const py = dx / len;
        const hw1 = b.w1 / 2;
        const hw2 = b.w2 / 2;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        const bk = b.bark;
        const bkN = bk ? bk.length / 2 : 0;
        if (bk && bkN >= 2){
          // right edge with bark bumps
          for (let bi = 0; bi <= bkN; bi++){
            const t = bi / bkN;
            const mx = tx + b.x1 + (b.x2 - b.x1) * t;
            const my = sy1 + (sy2 - sy1) * t;
            const mw = hw1 + (hw2 - hw1) * t + (bi > 0 && bi < bkN ? bk[bi * 2] : 0);
            if (bi === 0) ctx.moveTo(mx + px * mw, my + py * mw);
            else ctx.lineTo(mx + px * mw, my + py * mw);
          }
          // left edge in reverse with bark bumps
          for (let bi = bkN; bi >= 0; bi--){
            const t = bi / bkN;
            const mx = tx + b.x1 + (b.x2 - b.x1) * t;
            const my = sy1 + (sy2 - sy1) * t;
            const mw = hw1 + (hw2 - hw1) * t + (bi > 0 && bi < bkN ? bk[bi * 2 + 1] : 0);
            ctx.lineTo(mx - px * mw, my - py * mw);
          }
        } else {
          ctx.moveTo(tx + b.x1 + px * hw1, sy1 + py * hw1);
          ctx.lineTo(tx + b.x2 + px * hw2, sy2 + py * hw2);
          ctx.lineTo(tx + b.x2 - px * hw2, sy2 - py * hw2);
          ctx.lineTo(tx + b.x1 - px * hw1, sy1 - py * hw1);
        }
        ctx.closePath();
        ctx.fill();
        // bark grain lines
        if (b.grain && b.grain.length >= 2){
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          for (let gi = 0; gi < b.grain.length; gi += 2){
            const gOff = b.grain[gi];
            const gWob = b.grain[gi+1];
            const mw1 = hw1 * gOff, mw2 = hw2 * gOff;
            ctx.moveTo(tx + b.x1 + px * mw1, sy1 + py * mw1);
            const midX = tx + b.x1 + (b.x2-b.x1)*0.5;
            const midY = sy1 + (sy2-sy1)*0.5;
            const midW = (hw1+hw2)*0.5*(gOff+gWob);
            ctx.quadraticCurveTo(midX + px*midW, midY + py*midW, tx + b.x2 + px*mw2, sy2 + py*mw2);
          }
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          ctx.beginPath();
          for (let gi = 0; gi < b.grain.length; gi += 2){
            const gOff = b.grain[gi] + 0.05;
            const mw1 = hw1 * gOff, mw2 = hw2 * gOff;
            ctx.moveTo(tx + b.x1 + px*mw1, sy1 + py*mw1);
            ctx.lineTo(tx + b.x2 + px*mw2, sy2 + py*mw2);
          }
          ctx.stroke();
        }
        if (b.knots){
          for (const k of b.knots){
            const kx = tx + b.x1 + (b.x2-b.x1)*k.t;
            const ky = sy1 + (sy2-sy1)*k.t;
            const kw = hw1 + (hw2-hw1)*k.t;
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(kx + px*kw*k.off, ky + py*kw*k.off, k.r, k.r*0.6, Math.atan2(dy,dx), 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(kx + px*kw*k.off, ky + py*kw*k.off, k.r*1.5, k.r, Math.atan2(dy,dx), 0, Math.PI*2);
            ctx.fill();
          }
        }
      }

      // canopy blobs — sorted back-to-front, color based on absolute y in tree
      const yRange = t.maxCy - t.minCy || 1;
      for (const fr of t.fronds){
        const ox = tx + fr.cx;
        const oy = baseY + fr.cy;
        if (oy < -200 || oy > H + 100 || ox < -200 || ox > W + 200) continue;
        const f = fr.frond;
        const hull = f.hull;
        if (hull.length < 3) continue;

        // 0 = bottom of tree (dark), 1 = top of tree (light)
        const depthT = (t.maxCy - fr.cy) / yRange;
        const g = f.g;
        const lift = Math.round(depthT * 40);
        const r = Math.round(18 + g * 0.1 + lift * 0.4);
        const gv = Math.min(255, g + lift);
        const b = Math.round(18 + g * 0.08 + lift * 0.3);

        // hull fill
        ctx.fillStyle = `rgb(${r},${gv},${b})`;
        ctx.beginPath();
        ctx.moveTo(ox + (hull[hull.length-1].x + hull[0].x)/2, oy + (hull[hull.length-1].y + hull[0].y)/2);
        for (let hi = 0; hi < hull.length; hi++){
          const curr = hull[hi], next = hull[(hi+1)%hull.length];
          ctx.quadraticCurveTo(ox + curr.x, oy + curr.y, ox + (curr.x+next.x)/2, oy + (curr.y+next.y)/2);
        }
        ctx.closePath();
        ctx.fill();
        // gap cutouts — erase leaf shapes from hull edge
        if (f.gapLeaves){
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(ox + (hull[hull.length-1].x + hull[0].x)/2, oy + (hull[hull.length-1].y + hull[0].y)/2);
          for (let hi = 0; hi < hull.length; hi++){
            const curr = hull[hi], next = hull[(hi+1)%hull.length];
            ctx.quadraticCurveTo(ox + curr.x, oy + curr.y, ox + (curr.x+next.x)/2, oy + (curr.y+next.y)/2);
          }
          ctx.clip();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.beginPath();
          for (const gc of f.gapLeaves){
            const lx = ox + gc.x, ly = oy + gc.y;
            const cr2 = Math.cos(gc.rot), sr2 = Math.sin(gc.rot);
            const hl = gc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + gc.wid * sr2, ly - gc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - gc.wid * sr2, ly + gc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
          ctx.restore();
        }
        // edge leaves
        if (f.leafCircles){
          ctx.fillStyle = `rgb(${r},${gv},${b})`;
          ctx.beginPath();
          for (const lc of f.leafCircles){
            const lx = ox + lc.x, ly = oy + lc.y;
            const cr2 = Math.cos(lc.rot), sr2 = Math.sin(lc.rot);
            const hl = lc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + lc.wid * sr2, ly - lc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - lc.wid * sr2, ly + lc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
        }

        // inner highlight blob
        const ih = f.innerHull;
        const ir = Math.round(30 + g * 0.12 + lift * 0.5);
        const igv = Math.min(255, g + 22 + lift);
        const ib = 30 + Math.round(lift * 0.3);
        ctx.fillStyle = `rgb(${ir},${igv},${ib})`;
        ctx.beginPath();
        ctx.moveTo(ox + (ih[ih.length-1].x + ih[0].x)/2, oy + (ih[ih.length-1].y + ih[0].y)/2);
        for (let hi = 0; hi < ih.length; hi++){
          const curr = ih[hi], next = ih[(hi+1)%ih.length];
          ctx.quadraticCurveTo(ox + curr.x, oy + curr.y, ox + (curr.x+next.x)/2, oy + (curr.y+next.y)/2);
        }
        ctx.closePath();
        ctx.fill();
        // inner gap cutouts
        if (f.innerGapLeaves){
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(ox + (ih[ih.length-1].x + ih[0].x)/2, oy + (ih[ih.length-1].y + ih[0].y)/2);
          for (let hi = 0; hi < ih.length; hi++){
            const curr = ih[hi], next = ih[(hi+1)%ih.length];
            ctx.quadraticCurveTo(ox + curr.x, oy + curr.y, ox + (curr.x+next.x)/2, oy + (curr.y+next.y)/2);
          }
          ctx.clip();
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.beginPath();
          for (const gc of f.innerGapLeaves){
            const lx = ox + gc.x, ly = oy + gc.y;
            const cr2 = Math.cos(gc.rot), sr2 = Math.sin(gc.rot);
            const hl = gc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + gc.wid * sr2, ly - gc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - gc.wid * sr2, ly + gc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
          ctx.restore();
        }
        // inner edge leaves
        if (f.innerLeaves){
          ctx.beginPath();
          for (const lc of f.innerLeaves){
            const lx = ox + lc.x, ly = oy + lc.y;
            const cr2 = Math.cos(lc.rot), sr2 = Math.sin(lc.rot);
            const hl = lc.len / 2;
            ctx.moveTo(lx - hl * cr2, ly - hl * sr2);
            ctx.quadraticCurveTo(lx + lc.wid * sr2, ly - lc.wid * cr2, lx + hl * cr2, ly + hl * sr2);
            ctx.quadraticCurveTo(lx - lc.wid * sr2, ly + lc.wid * cr2, lx - hl * cr2, ly - hl * sr2);
          }
          ctx.fill();
        }
      }
    }
  }
}

/* ---------- ground ---------- */
function drawGround(){
  // base grass
  ctx.fillStyle = '#2f6b3a';
  ctx.fillRect(0, groundY, W, H - groundY);

  // path/trail
  ctx.fillStyle = '#8a7650';
  ctx.fillRect(0, groundY + 4, W, 14);
  ctx.fillStyle = '#7d6a48';
  ctx.fillRect(0, groundY + 7, W, 8);

  // grass tufts
  ctx.fillStyle = '#3c8246';
  tiled(42, 1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, groundY + 20);
    ctx.lineTo(x + 11, groundY + 8);
    ctx.lineTo(x + 14, groundY + 20);
    ctx.fill();
  });

  // second grass layer
  ctx.fillStyle = '#327837';
  tiled(63, 1.1, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 4, groundY + 22);
    ctx.lineTo(x + 7, groundY + 13);
    ctx.lineTo(x + 10, groundY + 22);
    ctx.fill();
  });

  // wildflowers
  tiled(97, 1, (x) => {
    ctx.fillStyle = '#f2c94c';
    ctx.beginPath(); ctx.arc(x + 30, groundY + 28, 2.4, 0, 7); ctx.fill();
  });
  tiled(131, 1, (x) => {
    ctx.fillStyle = '#e87fa0';
    ctx.beginPath(); ctx.arc(x + 50, groundY + 32, 2.0, 0, 7); ctx.fill();
  });
  tiled(173, 1, (x) => {
    ctx.fillStyle = '#a7d8f0';
    ctx.beginPath(); ctx.arc(x + 20, groundY + 26, 1.8, 0, 7); ctx.fill();
  });
}

/* ---------- foreground grass (closest layer, in front of character, bottom of view) ---------- */
function drawForegroundGrass(){
  const bottom = H;
  ctx.fillStyle = '#286e32';
  tiled(30, 1.3, (x) => {
    ctx.beginPath();
    ctx.moveTo(x, bottom);
    ctx.lineTo(x + 5, bottom - 45);
    ctx.lineTo(x + 10, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#1f5a28';
  tiled(44, 1.5, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 8, bottom);
    ctx.lineTo(x + 13, bottom - 55);
    ctx.lineTo(x + 18, bottom);
    ctx.fill();
  });
  ctx.fillStyle = '#37823c';
  tiled(52, 1.4, (x) => {
    ctx.beginPath();
    ctx.moveTo(x + 3, bottom);
    ctx.lineTo(x + 7, bottom - 35);
    ctx.lineTo(x + 11, bottom);
    ctx.fill();
  });
}

/* ---------- Krystal ---------- */
function drawKrystal(){
  const feetX = W*feetXFrac, dispH = dispHeight();
  const bob = state==='walk' ? Math.abs(Math.sin(scroll*0.045))*3 : 0;

  if (state === 'walk'){
    if (walkImg.complete && walkImg.naturalWidth){
      const fw = walkImg.naturalWidth/WALK_COLS, fh = walkImg.naturalHeight/WALK_ROWS;
      const dispW = dispH*(fw/fh);
      const foot = WALK_FOOT*dispH;
      ctx.drawImage(walkImg, walkFrame*fw, WALK_ROW_RIGHT*fh, fw, fh,
                    feetX-dispW/2, groundY+10-dispH+foot-bob, dispW, dispH);
    }
  } else {
    const img = exprImgs[currentExpr];
    if (img && img.complete && img.naturalWidth){
      const fw = img.naturalWidth/EXPR_COLS, fh = img.naturalHeight;
      const dispW = dispH*(fw/fh);
      const foot = EXPR_FOOT*dispH;
      ctx.drawImage(img, exprFrame*fw, 0, fw, fh,
                    feetX-dispW/2, groundY+10-dispH+foot, dispW, dispH);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(feetX, groundY+13, 22, 6, 0, 0, 7); ctx.fill();
}

/* ---------- loop ---------- */
function update(dt){
  // clouds and airplanes always drift, independent of character
  cloudTime += dt;
  updateAirplanes(dt);

  // Krystal always moves forward
  scroll += SPEED*dt;
  walkFrameTime += dt;
  if (walkFrameTime >= 1/WALK_FPS){ walkFrameTime -= 1/WALK_FPS; walkFrame = (walkFrame+1)%WALK_COLS; }

  if (state === 'walk'){
    if (celebratingKey && performance.now() >= recelebrateAt){
      if (currentFunKey() === celebratingKey) triggerCelebration(celebratingKey, FUN_TIMES[celebratingKey]);
      else celebratingKey = null;
    } else if (!celebratingKey && performance.now() >= nextRoutineAt){
      startRoutine();
    }
  } else {
    exprFrameTime += dt;
    if (exprFrameTime >= 1/EXPR_FPS){ exprFrameTime -= 1/EXPR_FPS; exprFrame = (exprFrame+1)%EXPR_COLS; }
    actionTimer -= dt;
    if (actionTimer <= 0) endAction();
  }

  updateJets(dt);
}

function draw(){
  const sky = skyColors();
  drawSky(sky);
  drawClouds();
  drawAirplanes(sky.night);
  drawMountains();
  drawHills();
  drawCities();
  drawIndustrial();
  drawSuburbs();
  drawFarms();
  drawBgTrees();
  drawMidTrees();
  drawGround();
  drawMfgTrees();
  drawJets();
  drawTrees();
  drawKrystal();
  drawForegroundGrass();
}

let last = performance.now();
let funTimeAccum = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  funTimeAccum += dt;
  if (funTimeAccum >= 1){ funTimeAccum = 0; checkFunTime(); }
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
checkFunTime();
requestAnimationFrame(loop);

/* ---------- debug (add ?debug to the URL) ---------- */
if (new URLSearchParams(location.search).has('debug')){
  const panel = document.getElementById('debugPanel');
  panel.classList.remove('hide');
  document.getElementById('debugGo').addEventListener('click', () => {
    const key = document.getElementById('debugKey').value.trim();
    if (key) triggerCelebration(key, FUN_TIMES[key] || 'Custom fun time!');
  });
  document.getElementById('debugRoutine').addEventListener('click', startRoutine);
}

/* ---------- keyboard: J = launch jets ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'j' || e.key === 'J') launchJets();
});
</script>
